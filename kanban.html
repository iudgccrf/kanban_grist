<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root { --bg:#f4f5f7; --col:#eeeef0; --card:#fff; --txt:#161616; --muted:#666; --accent:#3a55d8; --accent-bg:#e3e8fb; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Marianne","Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--txt); font-size:13px; display:flex; flex-direction:column; overflow:hidden; }
  header { flex:none; background:#fff; border-bottom:1px solid #ddd; padding:6px 12px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  header select, header input { font:inherit; padding:4px 6px; border:1px solid #ccc; border-radius:4px; background:#fff; max-width:150px; }
  header input[type=search] { width:140px; }
  header label { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:3px; }
  header button, .fb { font:inherit; border:1px solid #ccc; background:#fff; border-radius:4px; padding:4px 8px; cursor:pointer; }
  .fb.active { background:var(--accent-bg); border-color:var(--accent); color:#2b3a9a; font-weight:700; }
  header .spacer { flex:1; }
  #bands { flex:none; }
  /* le tableau occupe toute la hauteur : la barre de défilement horizontale reste toujours visible en bas */
  #board { flex:1; min-height:0; display:flex; gap:12px; padding:12px 12px 4px; align-items:flex-start; overflow-x:scroll; overflow-y:auto; }
  #board::-webkit-scrollbar { height:16px; width:12px; }
  #board::-webkit-scrollbar-track { background:#e4e6ec; border-radius:8px; }
  #board::-webkit-scrollbar-thumb { background:#9aa3c7; border-radius:8px; border:3px solid #e4e6ec; }
  #board::-webkit-scrollbar-thumb:hover { background:var(--accent); }
  #board { scrollbar-color:#9aa3c7 #e4e6ec; scrollbar-width:auto; }
  .col { flex:0 0 280px; background:var(--col); border-radius:6px; padding:8px; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .col.over { outline:2px dashed var(--accent); }
  .col.colover { outline:3px solid var(--accent); }
  .col h2 { margin:2px 4px 8px; font-size:15px; display:flex; align-items:center; gap:8px; cursor:grab; }
  .col h2 .grip { color:#aaa; font-size:12px; letter-spacing:-2px; }
  .dot { width:14px; height:14px; border-radius:50%; flex:none; }
  .count { margin-left:auto; background:#dde0e6; border-radius:10px; font-size:11px; padding:1px 7px; }
  .card { background:var(--card); border-radius:4px; padding:9px 10px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.18); cursor:pointer; }
  .card:hover { box-shadow:0 2px 6px rgba(0,0,0,.28); }
  .card.dragging { opacity:.4; }
  .card.open { outline:2px solid var(--accent); }
  .tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .tag { font-size:11px; font-weight:700; padding:2px 6px; border-radius:3px; white-space:nowrap; }
  .tag .x { margin-left:3px; opacity:.45; cursor:pointer; }
  .tag .x:hover { opacity:1; }
  .cplus { font-size:11px; padding:2px 8px; border:1px dashed #aab; border-radius:3px; color:#667; cursor:pointer; white-space:nowrap; background:none; font-family:inherit; }
  .cplus:hover { background:#eef1ff; color:var(--accent); border-color:var(--accent); }
  .title { font-size:14px; line-height:1.3; margin:2px 0 8px; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
  .date { font-weight:700; padding:1px 6px; border-radius:3px; }
  .d-ok { background:#c9f0d4; color:#1d6b35; }
  .d-orange { background:#ffe0b8; color:#9a4f00; }
  .d-red { background:#ffc9cc; color:#a3121d; }
  .d-grey { background:#e6e8ec; color:#555; }
  .avatars { margin-left:auto; display:flex; }
  .av { width:26px; height:26px; border-radius:50%; background:#c99a14; color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-left:-6px; border:2px solid #fff; flex:none; }
  .add { color:var(--accent); font-weight:600; cursor:pointer; padding:6px 4px; background:none; border:0; font:inherit; font-weight:600; }
  .vote, .tosuivi, .tobacklog { border:1px solid #ccc; background:#fafafa; border-radius:12px; padding:1px 8px; cursor:pointer; font:inherit; font-size:12px; }
  .vote:hover { background:#eaf0ff; }
  .tosuivi, .tobacklog { margin-left:auto; }
  .msg { padding:30px; color:var(--muted); }
  .info { margin:8px 12px 0; padding:5px 10px; background:#eef2ff; border:1px solid #cdd6f7; border-radius:4px; font-size:12px; color:#2b3a7a; }
  #diag { margin:8px 12px 0; padding:8px 10px; background:#fff; border:1px solid #bbb; border-radius:4px; font:11px/1.4 Consolas,monospace; white-space:pre-wrap; word-break:break-all; user-select:all; max-height:220px; overflow:auto; }
  .err { margin:8px 12px 0; padding:6px 10px; background:#ffd9dc; border:1px solid #e59aa1; border-radius:4px; font-size:12px; }
  .warn { margin:8px 12px 0; padding:6px 10px; background:#fff4d6; border:1px solid #f0d58a; border-radius:4px; font-size:12px; }

  /* panneau des couleurs */
  #panel { display:none; position:fixed; top:0; right:0; bottom:0; width:290px; background:#fff; border-left:1px solid #ccc; box-shadow:-4px 0 12px rgba(0,0,0,.15); z-index:20; overflow-y:auto; padding:12px; }
  #panel h3 { margin:14px 0 6px; font-size:13px; }
  #panel .row { display:flex; align-items:center; gap:8px; margin:4px 0; }
  #panel input[type=color] { width:34px; height:24px; padding:0; border:1px solid #ccc; border-radius:3px; background:none; cursor:pointer; }
  #panel input[type=number] { width:54px; }
  .close { border:0; background:none; font-size:22px; cursor:pointer; line-height:1; color:#555; }
  #panel .close { float:right; }

  /* fiche de la carte */
  #fiche { display:none; position:fixed; top:0; right:0; bottom:0; width:min(580px,100vw); background:#fff; border-left:1px solid #ccc; box-shadow:-6px 0 18px rgba(0,0,0,.2); z-index:20; overflow-y:auto; }
  #fiche .fhead { position:sticky; top:0; z-index:3; background:#fff; display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:1px solid #eee; }
  #fiche .ftitle { flex:1; min-width:0; font:inherit; font-size:18px; font-weight:700; border:1px solid transparent; border-radius:6px; padding:6px 8px; background:transparent; }
  #fiche .ftitle:hover, #fiche .ftitle:focus { border-color:#ccc; background:#fff; }
  #fiche .fbody { padding:10px 20px 40px; }
  .tb { display:flex; flex-wrap:wrap; gap:6px; }
  .dd { font:inherit; font-size:12px; font-weight:600; padding:6px 10px; border:1px solid #c9d0ea; border-radius:6px; background:#f4f6ff; color:#2b3a9a; cursor:pointer; white-space:nowrap; }
  .dd:hover, .dd.on { background:var(--accent-bg); border-color:var(--accent); }
  .dd.vote2 { background:#fff; border-color:#ccc; color:#333; margin-left:auto; }
  .summ { display:flex; flex-wrap:wrap; gap:6px 22px; margin:12px 0 4px; }
  .sg .lbl { font-size:11px; color:var(--muted); margin-bottom:3px; font-weight:600; }
  .sg .vals { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .sg .tag { font-size:12px; padding:3px 8px; border-radius:4px; }
  .none { color:#999; font-size:12px; }
  #fiche .sec { margin:18px 0 0; }
  #fiche .sh { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; margin:0 0 8px; }
  #fiche .sh .sub { margin-left:auto; font-weight:400; font-size:12px; color:var(--muted); }
  #fiche .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  #fiche .grow, .grow { flex:1; }
  #fiche input[type=text], #fiche textarea, #modal input[type=text], #modal select, #menu input[type=text], #menu input[type=date] { font:inherit; padding:7px 9px; border:1px solid #ccc; border-radius:6px; background:#fff; min-width:0; max-width:100%; }
  #fiche textarea { width:100%; resize:vertical; line-height:1.45; }
  #fiche textarea.desc { min-height:190px; }
  #fiche textarea.cmt { min-height:58px; }
  .btn { font:inherit; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; padding:6px 12px; cursor:pointer; }
  .btn.soft { background:var(--accent-bg); color:#2b3a9a; border-color:var(--accent-bg); font-weight:600; }
  .btn.ghost { background:#fff; color:#555; border-color:#ccc; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--accent-bg); border-radius:14px; padding:2px 8px 2px 3px; font-size:12px; }
  .chip .av { margin:0; border:0; width:22px; height:22px; font-size:9px; }
  .chip .x { cursor:pointer; opacity:.5; } .chip .x:hover { opacity:1; }
  .bar { height:7px; background:#e3e6ee; border-radius:4px; overflow:hidden; margin:2px 0 10px; }
  .bar > i { display:block; height:100%; background:var(--accent); transition:width .2s; }
  .ci { display:flex; align-items:center; gap:9px; margin:4px 0; }
  .ci input[type=checkbox] { width:18px; height:18px; flex:none; cursor:pointer; accent-color:var(--accent); }
  #fiche .ci input[type=text] { flex:1; border-color:transparent; background:transparent; padding:5px 6px; }
  #fiche .ci input[type=text]:hover, #fiche .ci input[type=text]:focus { border-color:#ccc; background:#fff; }
  .ci.done input[type=text] { text-decoration:line-through; color:#888; }
  .ci .del, .att .del, .cm .del { border:0; background:none; cursor:pointer; color:#999; font-size:16px; }
  .ci .del:hover, .att .del:hover, .cm .del:hover { color:#c00; }
  .drop { border:2px dashed #b9c3ee; background:#f1f4ff; border-radius:8px; padding:16px; text-align:center; color:#33408f; cursor:pointer; }
  .drop.over { background:#dfe6ff; border-color:var(--accent); }
  .drop b { text-decoration:underline; }
  .att { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid #e1e4ec; border-radius:6px; margin-bottom:6px; }
  .att a { flex:1; color:var(--accent); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .att a:hover { text-decoration:underline; }
  .att .sz { color:var(--muted); font-size:11px; }
  /* commentaires */
  .cm { display:flex; gap:9px; margin:10px 0 0; }
  .cm .av { margin:0; border:0; width:28px; height:28px; }
  .cm .cb { flex:1; min-width:0; }
  .cm .ch { font-size:12px; color:var(--muted); } .cm .ch b { color:var(--txt); font-size:13px; }
  .cm .ct { white-space:pre-wrap; word-wrap:break-word; margin:2px 0; line-height:1.4; }
  .cm .ca { font-size:12px; } .cm .ca button { border:0; background:none; color:var(--accent); cursor:pointer; padding:0 8px 0 0; font:inherit; font-size:12px; }
  .cm .rep { margin-left:0; padding-left:14px; border-left:2px solid #e3e6ee; }
  .mention { color:var(--accent); font-weight:700; background:var(--accent-bg); border-radius:3px; padding:0 3px; }

  /* menus déroulants, fenêtres */
  #menu { display:none; position:fixed; z-index:40; background:#fff; border:1px solid #bbb; border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.28); min-width:210px; max-width:300px; max-height:70vh; overflow-y:auto; padding:6px; }
  #menu .mi { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:5px; cursor:pointer; }
  #menu .mi:hover { background:#f1f3fb; }
  #menu .mi.pick { font-weight:600; }
  #menu .mh { font-size:11px; color:var(--muted); padding:4px 8px; text-transform:uppercase; letter-spacing:.03em; }
  #menu .sep { border-top:1px solid #eee; margin:6px 0; }
  #menu .row { display:flex; gap:6px; padding:2px 4px; }
  #menu .row input { flex:1; }
  #menu .lnk { color:var(--accent); cursor:pointer; padding:4px 8px; border-radius:5px; display:block; font-size:12px; } #menu .lnk:hover { background:#f1f3fb; }
  #modal { display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%); width:min(520px,96vw); max-height:80vh; overflow-y:auto; background:#fff; border:1px solid #aaa; border-radius:10px; box-shadow:0 10px 34px rgba(0,0,0,.35); z-index:50; padding:14px 16px; }
  #modal h3 { margin:0 0 10px; font-size:15px; }
  #modal .mrow { display:flex; align-items:center; gap:8px; margin:5px 0; }
  #modal .mrow input { flex:1; }
  #modal .cnt { color:var(--muted); font-size:11px; white-space:nowrap; }
  #modal .mmsg { margin:8px 0; font-size:12px; padding:6px 8px; background:#fff4d6; border-radius:5px; }
  #modal .hint { font-size:11px; color:var(--muted); margin-top:8px; }
  #pop { display:none; position:fixed; top:80px; left:50%; transform:translateX(-50%); width:310px; background:#fff; border:1px solid #bbb; border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.3); z-index:30; padding:12px; }
  #pop .row { display:flex; gap:6px; margin:8px 0; }
  #pop input { font:inherit; padding:5px 6px; border:1px solid #ccc; border-radius:4px; flex:1; min-width:0; }
  #pop button { font:inherit; padding:5px 10px; border:1px solid #ccc; border-radius:4px; background:#fff; cursor:pointer; }
  #pop button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #pop .hint { font-size:11px; color:var(--muted); }
  .fmeta { font-size:11px; color:var(--muted); padding:0 20px 2px; margin-top:-4px; }
  .hl { font-size:12px; margin:5px 0; line-height:1.45; color:#333; } .hl .hd { color:var(--muted); } .hl .hv { background:#f1f3f8; border-radius:3px; padding:0 4px; }
  .vote.on, .dd.vote2.on { background:var(--accent-bg); border-color:var(--accent); color:#2b3a9a; font-weight:700; }
  .warnc { color:#b25e00; cursor:help; }
  #menu select { font:inherit; padding:5px 6px; border:1px solid #ccc; border-radius:5px; background:#fff; flex:1; min-width:0; }
</style>
</head>
<body>
<header id="hdr"></header>
<div id="bands"><div id="warn"></div><div id="err"></div><div id="diag" style="display:none"></div></div>
<div id="board"><div class="msg">Chargement… Associez les colonnes dans le panneau de configuration du widget.</div></div>
<div id="panel"></div>
<div id="fiche"></div>
<div id="menu"></div>
<div id="modal"></div>
<div id="pop"></div>

<script>
/* ============ CONFIGURATION ============ */
const VERSION = '2026-10-30 g';   // affichée dans le bandeau et le diagnostic : permet de vérifier que le bon fichier est chargé
const STATUTS = ['A faire','En cours','Bloqué','A valider','Terminé','Abandonné','Archivé'];
const PRIOS   = ['P0 Critique','P1 Important','P2 Souhaitable','P3 Appréciable','Nouveau','Abandonné','Déjà prévu'];
const CHARGES = ['XS','S','M','L','XL'];
const STATUT_TERMINE = ['Terminé','Archivé'];   // dates affichées en vert
const STATUT_COLORS = ['#1e9ac8','#9bbf5a','#e5484d','#f5a623','#17b3a3','#8a8f98','#555b66'];
const PRIO_COLORS   = ['#e5484d','#f5a623','#1e9ac8','#6b8fb8','#9bbf5a','#8a8f98','#555b66'];
const PALETTE = [['#fdf1c4','#6b5a10'],['#fcd9d9','#8a2b2b'],['#d6eef7','#1f5f78'],['#dcebd9','#355a2f'],
                 ['#e8dcf5','#59397a'],['#ffe2c9','#8a4a12'],['#d9ecec','#245f5f'],['#ffd9e8','#8a2b55']];
const PRIO_TAG = [[/^P0/,['#fcd9d9','#b3202f']],[/^P1/,['#fff0c2','#8a5a00']],[/^P2/,['#d6eef7','#1f5f78']],[/^P3/,['#dde6f2','#3b5a80']]];

// Tables annexes (à créer dans Grist, voir le guide). Le widget retrouve les colonnes par leur nom (accents et majuscules ignorés).
const TABLES = {
  comments: {table:'Commentaires', pick:{task:/^tache/, parent:/^parent/, text:/^(texte|text|message|commentaire)/, author:/^(auteur|created_?by|cree_?par|qui)/, date:/^(date|created_?at|cree_?le|horodat|quand)/, email:/(courriel|couriel|e_?mail|^mail)/, mentions:/^mention/}},
  history:  {table:'Historique',   pick:{task:/^tache/, event:/^(evenement|event|champ|type)/, before:/^(avant|ancien)/, after:/^(apres|nouveau|nouvelle)/, author:/^(auteur|created_?by|cree_?par|qui)/, date:/^(date|created_?at|cree_?le|horodat|quand)/, email:/(courriel|couriel|e_?mail|^mail)/}},
};
const SIDE_POLL_MS = 15000;
const HIST_KEYS = {statut:'Statut', prio:'Prio', charge:'Charge', echeance:'Échéance', responsables:'Responsables'};   // champs dont les changements sont journalisés
const CARD_KEYS = ['statut','prio','charge'];       // champs modifiables avec le bouton ＋ des cartes
const STATUT_DEFAUT = 'A faire';

// Champs modifiables depuis la carte et la fiche
const FIELDS = [
  {key:'statut',       label:'Statut',       kind:'single', fallback:STATUTS},
  {key:'prio',         label:'Prio',         kind:'single', fallback:PRIOS},
  {key:'charge',       label:'Charge',       kind:'single', fallback:CHARGES},
  {key:'personas',     label:'Personas',     kind:'tags'},
  {key:'themes',       label:'Thèmes',       kind:'tags'},
  {key:'produit',      label:'Produit',      kind:'tags'},
  {key:'sources',      label:'Sources',      kind:'tags'},
  {key:'etiquettes',   label:'Étiquettes',   kind:'tags'},
  {key:'responsables', label:'Responsables', kind:'people'},
  {key:'echeance',     label:'Échéance',     kind:'date'},
];
// Filtres (tous à choix multiples)
const FILTERS = [
  {id:'statut',     key:'statut',    label:'Statut',    skipIn:'backlog'},
  {id:'prio',       key:'prio',      label:'Prio',      skipIn:'backlog'},
  {id:'charge',     key:'charge',    label:'Charge'},
  {id:'personas',   key:'personas',  label:'Personas'},
  {id:'themes',     key:'themes',    label:'Thèmes'},
  {id:'personne',   key:'personnes', label:'Personne',  skipIn:'perso', field:'responsables'},
  {id:'produit',    key:'produit',   label:'Produit'},
  {id:'sources',    key:'sources',   label:'Sources'},
  {id:'etiquettes', key:'etiquettes',label:'Étiquettes'},
];

const COLS = [
  {name:'titre',        title:'Titre de la tâche',                    type:'Text'},
  {name:'statut',       title:'Statut (colonnes du Suivi)',           type:'Choice'},
  {name:'prio',         title:'Priorité (colonnes du Backlog)',       type:'Choice'},
  {name:'charge',       title:'Charge (XS…XL)',                       type:'Choice', optional:true},
  {name:'personas',     title:'Personas',                             type:'Choice,ChoiceList', optional:true},
  {name:'produit',      title:'Produit',                              type:'Choice,ChoiceList', optional:true},
  {name:'themes',       title:'Thèmes',                               type:'Choice,ChoiceList', optional:true},
  {name:'sources',      title:'Sources',                              type:'Choice,ChoiceList', optional:true},
  {name:'etiquettes',   title:'Étiquettes libres (Liste de choix)',   type:'ChoiceList', optional:true},
  {name:'responsables', title:'Responsables (colonne de RÉFÉRENCE vers Equipe)', type:'Ref,RefList', optional:true},
  {name:'personnes',    title:'Responsables (colonne texte, si pas de référence)', type:'Text,ChoiceList', optional:true},
  {name:'echeance',     title:"Date d'échéance",                      type:'Date,DateTime', optional:true},
  {name:'description',  title:'Description (colonne Texte)',          type:'Text', optional:true},
  {name:'checklist',    title:'Checklist (colonne Texte)',            type:'Text', optional:true},
  {name:'pj',           title:'Pièces jointes',                       type:'Attachments', optional:true},
  {name:'commentaires', title:'Nb de commentaires (inutile si table Commentaires)', type:'Int,Numeric', optional:true},
  {name:'votes',        title:'Votes (compteur simple, si pas de Votants)', type:'Int,Numeric', optional:true},
  {name:'votants',      title:'Votants (Liste de références vers Equipe : un vote par personne)', type:'RefList', optional:true},
  {name:'creePar',      title:'Créé par (colonne Texte)',             type:'Text', optional:true},
  {name:'creeLe',       title:'Créé le (Date et heure)',              type:'Date,DateTime', optional:true},
  {name:'modifPar',     title:'Modifié par (colonne Texte)',          type:'Text', optional:true},
  {name:'modifLe',      title:'Modifié le (Date et heure)',           type:'Date,DateTime', optional:true},
];

/* ============ ÉTAT ============ */
const $ = id => document.getElementById(id);
let mode = 'suivi';            // suivi | backlog | perso
let moi = lsGet('moi','');   // personne qui utilise CE navigateur (mémorisée dans le navigateur, pas partagée)
let grp = 'statut';           // regroupement des colonnes en vue Suivi : statut | prio
let sortPref = lsGet('sort', []);   // critères de tri (propres à ce navigateur)
let map = null;                // association des colonnes
let host = null;               // identifiant de la table où le widget est installé
let rawRecs = [];              // lignes telles que reçues de Grist
let records = [];              // lignes converties (noms du widget)
let index = new Map();         // id -> enregistrement
let pending = new Map();       // id -> {changes, t} : modifications en cours d'enregistrement (évite les effets de retour en arrière)
let colors = {groups:{}, tags:{}};
let colOrder = {};             // ordre des colonnes du Kanban, par mode
let thr = {orange:3, red:1};
let panelOpen = false;
let openId = null;             // carte ouverte dans la fiche
let ficheSig = '';             // signature de la carte affichée (évite de reconstruire la fiche inutilement)
let metaTick = 0, metaSig = '', meta = {}, metaNote = '';
let team = [], teamById = {}, teamCol = null, teamTable = null;
let attMeta = {};              // id de pièce jointe -> {name, size}
const mkSide = ()=>({rows:[], ok:null, note:'', tick:0, sig:'', cols:null, fill:new Set()});
const side = {comments: mkSide(), history: mkSide()};   // tables annexes

const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toList(v){
  if (v == null || v === '') return [];
  if (Array.isArray(v)) return (v[0]==='L' ? v.slice(1) : v).map(String).filter(Boolean);
  return String(v).split(',').map(s=>s.trim()).filter(x=>x && x!=='[]');
}
function refIds(v){   // identifiants de lignes d'une colonne Référence / Liste de références
  if (v == null || v === '' || v === 0) return [];
  const arr = Array.isArray(v) ? (v[0]==='L' ? v.slice(1) : v) : [v];
  return arr.map(x=> (x && typeof x==='object') ? (x.rowId ?? x.id) : x).filter(x=>typeof x==='number' && x>0);
}
function g(r,k){ return map && map[k] ? r[k] : undefined; }
// valeurs d'une fiche pour un champ, sous forme de liste de textes
function L(r,k){
  const v = g(r,k);
  if (k==='personnes') return toList(v);
  if (Array.isArray(v)) return toList(v);
  return v==null || v==='' ? [] : [String(v)];
}
function hash(s){ let h=0; for (const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function rgb(hex){ const n=parseInt(hex.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function toHex(a){ return '#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''); }
function lighten(hex,p){ return toHex(rgb(hex).map(v=>v*(1-p)+255*p)); }
function darken(hex,p){ return toHex(rgb(hex).map(v=>v*(1-p))); }
function defaultTagColors(label,kind){
  if (kind==='prio') for (const [re,col] of PRIO_TAG) if (re.test(label)) return col;
  return PALETTE[hash(label)%PALETTE.length];
}
function tagColors(label,kind){
  if (colors.tags[label]) return [lighten(colors.tags[label],.8), darken(colors.tags[label],.45)];
  return defaultTagColors(label,kind);
}
function tag(label, kind){ const c = tagColors(label,kind); return `<span class="tag" style="background:${c[0]};color:${c[1]}">${esc(label)}</span>`; }
function tagX(label, key){
  return tag(label, key==='prio'?'prio':'').replace(/<\/span>$/, `<span class="x" data-rm="${key}" data-val="${esc(label)}" title="Retirer">×</span></span>`);
}
function toDate(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return new Date(v*1000);
  const d = new Date(v); return isNaN(d) ? null : d;
}
function dayStart(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function fmtDate(d){ return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
function fmtDateTime(d){ return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function initials(n){ return String(n||'?').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function fmtSize(n){ if(!n) return ''; return n>1048576 ? (n/1048576).toFixed(1)+' Mo' : Math.max(1,Math.round(n/1024))+' Ko'; }

// Grist peut envoyer les lignes avec les noms réels des colonnes (Titre, Statut…) ou déjà renommées (titre, statut…).
function normalize(rec){
  const out = {id: rec.id};
  for (const k in map){
    const c = map[k]; if (!c || c[0]==='@') continue;
    out[k] = (c in rec) ? rec[c] : rec[k];
  }
  derive(out);
  const p = pending.get(out.id);
  if (p){ if (Date.now()-p.t < 4000){ Object.assign(out, p.changes); derive(out); } else pending.delete(out.id); }
  return out;
}
function derive(r){   // noms des responsables, à partir de la colonne de référence
  if (map && map.responsables && teamById && Object.keys(teamById).length)
    r.personnes = refIds(r.responsables).map(id=>teamById[id] || ('#'+id)).join(', ');
}
function ingest(){ records = (rawRecs && map) ? rawRecs.map(normalize) : []; render(); }

/* ---- Checklist ---- */
const CL_RE = /^(\s*[-*]\s*)\[( |x|X)\]\s?(.*)$/;
function parseChecklist(text){
  const lines = String(text||'').split('\n'), items = [];
  lines.forEach((l,i)=>{ const m = l.match(CL_RE); if (m) items.push({i, done:m[2].toLowerCase()==='x', text:m[3]}); });
  return {lines, items};
}
function checklistCount(t){ const {items} = parseChecklist(t); return {done: items.filter(x=>x.done).length, total: items.length}; }

/* ---- Préférences propres à ce navigateur (non partagées) ---- */
function lsGet(k, d){ try { const v = localStorage.getItem('kanban.'+k); return v==null ? d : JSON.parse(v); } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem('kanban.'+k, JSON.stringify(v)); } catch(e){} }
const norm = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const meObj = () => team.find(t=>t.label===moi) || null;
function who(s){   // nom lisible : « prenom.nom », courriel ou nom → nom de la table Equipe quand on le retrouve
  s = String(s==null?'':s).trim(); if (!s) return '';
  const n = norm(s);
  const p = team.find(t=>{ const l = norm(t.label), em = norm(t.email); return l===n || l.replace(/\s+/g,'.')===n || (em && (em===n || em.split('@')[0]===n)); });
  return p ? p.label : s;
}
function resolveCols(t, pick){
  const keys = Object.keys(t).filter(k=>k!=='id' && !/^(manualSort|gristHelper_)/.test(k));
  const used = new Set(), out = {};
  for (const name in pick){ const k = keys.find(x=>!used.has(x) && pick[name].test(norm(x))); out[name] = k || null; if (k) used.add(k); }
  return out;
}
function valLabel(card, k, v){   // valeur lisible d'un champ (pour le journal)
  const x = v===undefined ? card[k] : v;
  if (k==='responsables') return refIds(x).map(id=>teamById[id]||('#'+id)).join(', ');
  if (k==='echeance'){ const d = toDate(x); return d ? d.toLocaleDateString('fr-FR') : ''; }
  return Array.isArray(x) ? toList(x).join(', ') : (x==null ? '' : String(x));
}

/* ============ MÉTADONNÉES DES COLONNES ============ */
async function loadMeta(){
  meta = {}; team = []; teamById = {}; teamCol = null; teamTable = null; metaNote = '';
  try {
    const T = await grist.docApi.fetchTable('_grist_Tables');
    const C = await grist.docApi.fetchTable('_grist_Tables_column');
    const ti = T.id[T.tableId.indexOf(host)];
    const colById = {}; C.id.forEach((id,i)=>{ colById[id] = C.colId[i]; });
    const cols = {};
    C.id.forEach((id,i)=>{ if (C.parentId[i]===ti) cols[C.colId[i]] = {type:C.type[i], wo:C.widgetOptions[i], vis:C.visibleCol[i]}; });
    for (const k in map){
      const c = map[k]; if (!c || c[0]==='@' || !cols[c]) continue;
      let woObj = {}; try { woObj = JSON.parse(cols[c].wo||'{}') || {}; } catch(e){}
      const m = String(cols[c].type).match(/^Ref(?:List)?:(.+)$/);
      meta[k] = {col:c, type:String(cols[c].type), woObj, choices:(woObj.choices||[]).map(String), ref: m ? m[1] : null, visCol: cols[c].vis ? colById[cols[c].vis] : null};
    }
    if (meta.responsables && meta.responsables.ref){
      teamTable = meta.responsables.ref;
      const E = await grist.docApi.fetchTable(teamTable);
      let lab = meta.responsables.visCol;
      if (!lab || !(lab in E)) lab = ['Nom','nom','NOM','Name','name','Titre'].find(x=>x in E) || Object.keys(E).find(x=>!/^(id|manualSort|gristHelper_)/.test(x));
      teamCol = lab;
      const emCol = Object.keys(E).find(x=>/courriel|couriel|e_?mail|^mail/i.test(x));
      (E.id||[]).forEach((id,i)=>{ const label = String(E[lab] ? E[lab][i] : '').trim(); if (label) { team.push({id, label, email: emCol ? String(E[emCol][i]||'').trim() : ''}); teamById[id] = label; } });
      team.sort((a,b)=>a.label.localeCompare(b.label,'fr'));
      metaNote = `table « ${teamTable} » (colonne « ${lab} ») : ${team.length} personne(s)`;
    }
  } catch(e){ metaNote = 'métadonnées indisponibles : '+((e&&e.message)||e); }
  metaTick++;
}
async function ensureMeta(force){
  const sig = host+'|'+JSON.stringify(map);
  if (!host || !map || (sig===metaSig && !force)) return;
  metaSig = sig;
  await loadMeta();
  ingest();
}
async function reloadMeta(){ metaSig=''; await ensureMeta(true); }
// valeurs proposées : choix déclarés dans la colonne Grist (sinon valeurs par défaut) + valeurs déjà utilisées
function choicesFor(k, fallback=[]){
  const base = (meta[k] && meta[k].choices && meta[k].choices.length) ? meta[k].choices : fallback;
  const used = [...new Set(records.flatMap(r=>L(r,k)))];
  return [...new Set([...base.map(String), ...used])];
}
function isListCol(key){
  if (meta[key] && meta[key].type) return /^ChoiceList/.test(meta[key].type);
  const vals = records.map(r=>g(r,key)).filter(v=>v!=null && v!=='');
  return vals.length===0 || vals.some(v=>Array.isArray(v));
}
function isListRef(){
  if (meta.responsables && meta.responsables.type) return /^RefList/.test(meta.responsables.type);
  return records.some(r=>Array.isArray(r.responsables));
}
async function loadAttachMeta(){

    attMeta = {}; (A.id||[]).forEach((id,i)=>{ attMeta[id] = {name:A.fileName ? A.fileName[i] : ('Fichier '+id), size:A.fileSize ? A.fileSize[i] : 0}; });

/* ============ COMMENTAIRES (table séparée) ============ */
function fillBlanks(kind, t, c){   // complète auteur / courriel / date si la formule de Grist ne l'a pas fait
  const S = side[kind], me = meObj(), ups = [];
  S.fill.forEach(rid=>{
    const i = (t.id||[]).indexOf(rid); if (i<0) return; const f = {};
    if (me && c.author && !t[c.author][i]) f[c.author] = me.label;
    if (me && me.email && c.email && !t[c.email][i]) f[c.email] = me.email;
    if (c.date && (t[c.date][i]==null || t[c.date][i]==='')) f[c.date] = Math.floor(Date.now()/1000);
    if (Object.keys(f).length) ups.push(['UpdateRecord', TABLES[kind].table, rid, f]);
  });
  return ups;
}
async function loadTable(kind, again){
  const T = TABLES[kind], S = side[kind]; let sig = '';
  try {
    const t = await grist.docApi.fetchTable(T.table);
    const c = resolveCols(t, T.pick);
    if (!c.task) throw new Error('colonne « Tache » (référence vers Taches) absente');
    if (kind==='comments' && !c.text) throw new Error('colonne « Texte » absente');
    S.cols = c;
    if (S.fill.size && !again){
      const ups = fillBlanks(kind, t, c); S.fill.clear();
      if (ups.length){ await grist.docApi.applyUserActions(ups); return loadTable(kind, true); }
    }
    const cell = (col,i) => col ? t[col][i] : null;
    S.rows = (t.id||[]).map((id,i)=>({id, task: refIds(cell(c.task,i))[0]||0, parent: refIds(cell(c.parent,i))[0]||0,
      text: String(cell(c.text,i) ?? ''), event: String(cell(c.event,i) ?? ''), before: String(cell(c.before,i) ?? ''), after: String(cell(c.after,i) ?? ''),
      author: String(cell(c.author,i) ?? ''), email: String(cell(c.email,i) ?? ''), date: c.date ? toDate(cell(c.date,i)) : null}));
    S.ok = true; S.note = S.rows.length+' ligne(s)';
    sig = JSON.stringify(S.rows);
  } catch(e){ S.rows = []; S.cols = null; S.ok = false; S.note = ((e&&e.message)||String(e)); sig = 'ko:'+S.note; }
  if (sig !== S.sig){ S.sig = sig; S.tick++; render(); }
}
const loadSide = () => Promise.all([loadTable('comments'), loadTable('history')]);
function histActions(entries){
  const c = side.history.cols; if (!c || !c.task) return [];
  return entries.map(e=>{ const f = {[c.task]: e.taskId};
    if (c.event) f[c.event] = e.event; if (c.before) f[c.before] = e.before||''; if (c.after) f[c.after] = e.after||'';
    return ['AddRecord', TABLES.history.table, null, f]; });
}
const commentsOf = id => side.comments.rows.filter(c=>c.task===id);
const historyOf = id => side.history.rows.filter(h=>h.task===id);
function commentCount(r){ return side.comments.ok ? commentsOf(r.id).length : (Number(g(r,'commentaires'))||0); }
async function addComment(taskId, parentId, text){
  text = String(text||'').trim(); if (!text) return false;
  const c = side.comments.cols; if (!c){ alert('Table « '+TABLES.comments.table+' » inutilisable : '+side.comments.note); return false; }
  const f = {[c.task]: taskId, [c.text]: text};
  if (parentId && c.parent) f[c.parent] = parentId;

async function deleteComment(id){
  const del = new Set([id]); let grown = true;
  while (grown){ grown = false; side.comments.rows.forEach(c=>{ if (c.parent && del.has(c.parent) && !del.has(c.id)){ del.add(c.id); grown = true; } }); }
  await actRes([...del].map(i=>['RemoveRecord', TABLES.comments.table, i]));
  await loadTable('comments');
}
function mentionHtml(text){
  let h = esc(text);
  [...team].sort((a,b)=>b.label.length-a.label.length).forEach(p=>{ h = h.split('@'+esc(p.label)).join(`<span class="mention">@${esc(p.label)}</span>`); });
  return h;
}

/* ============ ÉCRITURE DANS GRIST ============ */
// Met à jour la carte tout de suite à l'écran (optimiste), puis écrit dans Grist.
// changes : {cléWidget: valeur affichée} ; encoded : {cléWidget: valeur envoyée à Grist} (listes : ['L', ...])
async function update(card, changes, encoded, extraLog){
  const cols = {}, applied = {}, log = (extraLog||[]).map(e=>({taskId: card.id, ...e}));
  for (const k in changes){
    if (!map[k]) continue;
    if (HIST_KEYS[k]){ const b = valLabel(card,k), a = valLabel(card,k,changes[k]); if (b!==a) log.push({taskId: card.id, event: HIST_KEYS[k], before: b, after: a}); }
    card[k] = changes[k]; applied[k] = changes[k];
    cols[map[k]] = (encoded && k in encoded) ? encoded[k] : changes[k];
  }
  if (!Object.keys(cols).length) return false;
  const p = pending.get(card.id) || {changes:{}, t:0};
  Object.assign(p.changes, applied); p.t = Date.now(); pending.set(card.id, p);
  derive(card); render();
  const main = [['UpdateRecord', host, card.id, cols]], hist = histActions(log);
  let res;
  if (hist.length){
    res = await actRes(main.concat(hist), true);          // modification + journal dans une seule opération
    if (res){ histNote = ''; (res.retValues||[]).slice(1).forEach(id=>{ if (typeof id==='number') side.history.fill.add(id); }); loadTable('history'); }
    else { res = await actRes(main); if (res) histNote = "Le journal n'a pas pu être enregistré : vérifiez la table « Historique » (droits, colonnes)."; }
  } else res = await actRes(main);
  if (!res){ pending.delete(card.id); ingest(); return false; }
  return true;
}
async function actRes(actions, quiet){
  if (!host){ if (!quiet) alert("Table du widget introuvable : rechargez la page."); return null; }
  try { return (await grist.docApi.applyUserActions(actions)) || {retValues:[]}; }
  catch(e){ if (!quiet) alert('Action refusée ou impossible : ' + ((e && e.message) || e)); return null; }
}
async function act(actions){ return !!(await actRes(actions)); }

/* ============ VALEURS D'UN CHAMP (carte, fiche, filtres) ============ */
const fieldOn = f => map && (f.key==='responsables' ? (map.responsables || map.personnes) : map[f.key]);
function optionsFor(key){   // [{v, label}]
  if (key==='responsables') return team.map(t=>({v:t.id, label:t.label}));
  const f = FIELDS.find(x=>x.key===key);
  return choicesFor(key, (f && f.fallback) || []).map(v=>({v, label:v}));
}
function isMulti(key){ return key==='responsables' ? isListRef() : (FIELDS.find(x=>x.key===key).kind==='tags' && isListCol(key)); }
function selectedOf(card, key){   // valeurs sélectionnées (ids pour les personnes)
  if (key==='responsables') return refIds(card.responsables);
  return L(card, key);
}
function setField(card, key, v){   // choisit (ou décoche) une valeur
  if (key==='responsables'){
    const list = isListRef(), cur = refIds(card.responsables), has = cur.includes(v);
    const ids = list ? (has ? cur.filter(x=>x!==v) : [...cur, v]) : (has ? [] : [v]);
    return update(card, {responsables: list ? ids : (ids[0]||0)}, {responsables: list ? ['L',...ids] : (ids[0]||0)});
  }
  const cur = L(card,key), has = cur.includes(v);
  if (isMulti(key)){ const next = has ? cur.filter(x=>x!==v) : [...cur, v]; return update(card, {[key]: next}, {[key]: ['L',...next]}); }
  return update(card, {[key]: has ? null : v});
}
function clearField(card, key){
  if (key==='responsables') return update(card, {responsables: isListRef()?[]:0}, {responsables: isListRef()?['L']:0});
  if (isMulti(key)) return update(card, {[key]: []}, {[key]: ['L']});
  return update(card, {[key]: null});
}
function removeValue(card, key, v){ if (key==='responsables') return setField(card,key,+v); return setField(card,key,String(v)); }

/* --- votes : un vote par personne si la colonne Votants est associée --- */
const voteCount = r => map.votants ? refIds(r.votants).length : (Number(g(r,'votes'))||0);
const hasVoted = r => { const m = meObj(); return !!(map.votants && m && refIds(r.votants).includes(m.id)); };
function castVote(card){
  if (!card) return;
  if (map.votants){
    const m = meObj();
    if (!m){ alert("Choisissez qui vous êtes dans la liste « Moi » (en haut de la vue) pour voter : un vote par personne."); return; }
    const cur = refIds(card.votants), ids = cur.includes(m.id) ? cur.filter(x=>x!==m.id) : [...cur, m.id];
    return update(card, {votants: ids}, {votants: ['L', ...ids]});
  }
  return update(card, {votes: (Number(g(card,'votes'))||0)+1});
}

/* --- création de nouvelles valeurs --- */
async function widgetOptsWrite(key, mutate){
  const m = meta[key]; if (!m) throw new Error('colonne introuvable (métadonnées non chargées)');
  const wo = JSON.parse(JSON.stringify(m.woObj||{})); wo.choices = [...(wo.choices||m.choices||[])];
  mutate(wo);
  await grist.docApi.applyUserActions([['ModifyColumn', host, m.col, {widgetOptions: JSON.stringify(wo)}]]);
}
async function addChoice(key, v){
  if (!meta[key] || meta[key].choices.includes(v)) return;
  try { await widgetOptsWrite(key, wo=>wo.choices.push(v)); await reloadMeta(); } catch(e){ /* sans droit sur la structure : la valeur est quand même utilisable */ }
}
async function createPerson(name){
  if (!teamTable || !teamCol) throw new Error('table des responsables introuvable');
  const res = await grist.docApi.applyUserActions([['AddRecord', teamTable, null, {[teamCol]: name}]]);
  const id = res && res.retValues && res.retValues[0];
  await reloadMeta(); return id;
}
async function createAndSet(card, key, name){
  name = String(name||'').trim(); if (!name) return;
  if (key==='responsables'){
    try { const id = await createPerson(name); if (typeof id==='number' && !refIds(card.responsables).includes(id)) await setField(card,key,id); }
    catch(e){ alert('Création impossible : '+((e&&e.message)||e)); }
    return;
  }
  if (FIELDS.find(f=>f.key===key).kind==='tags' || true){ await addChoice(key, name); }
  if (!L(card,key).includes(name)) await setField(card,key,name);
}

/* ============ MENUS DÉROULANTS ============ */
function openMenu(anchor, build){ if (menu && menu.anchor===anchor){ closeMenu(); return; } menu = {anchor, build}; renderMenu(); }
function closeMenu(){ menu = null; $('menu').style.display='none'; }
function renderMenu(){
  const el = $('menu');
  if (!menu){ el.style.display='none'; return; }
  const a = document.querySelector(`[data-anchor="${menu.anchor}"]`);
  if (!a){ closeMenu(); return; }
  const ae = document.activeElement;
  if (el.contains(ae) && ae.tagName==='INPUT' && ['text','date','search'].includes(ae.type) && ae.value) return;          // on ne casse pas une saisie en cours
  const b = menu.build();
  el.innerHTML = b.html; el.style.display = 'block';
  const r = a.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(6, Math.min(r.left, window.innerWidth - w - 8))+'px';
  el.style.top  = (r.bottom + h + 12 > window.innerHeight && r.top > h + 12 ? Math.max(6, r.top - h - 4) : r.bottom + 4)+'px';
  b.bind(el);
}
function fieldPicker(cardId){
  return ()=>({ html: '<div class="mh">Ajouter / modifier</div>' + FIELDS.filter(f=>CARD_KEYS.includes(f.key) && fieldOn(f)).map(f=>`<div class="mi" data-pk="${f.key}">${f.label}</div>`).join(''),
    bind: el=>el.querySelectorAll('[data-pk]').forEach(x=>x.onclick=()=>{ menu.build = fieldMenu(cardId, x.dataset.pk, true); renderMenu(); }) });
}
function fieldMenu(cardId, key, fromPicker){
  return ()=>{
    const f = FIELDS.find(x=>x.key===key), c = index.get(cardId);
    if (!c) return {html:'', bind(){}};

    if (f.kind==='date'){
      const d = toDate(g(c,'echeance')), editable = meta.echeance && meta.echeance.type==='Date';
      html += editable ? `<div class="row"><input type="date" id="mn-date" value="${d?d.toISOString().slice(0,10):''}"></div>${d?'<span class="lnk" data-clr>Effacer la date</span>':''}`
                       : `<div class="mh" style="text-transform:none">Modifiable seulement pour une colonne de type « Date » (pas « Date et heure »).</div>`;
    } else {
      const multi = isMulti(key), sel = selectedOf(c,key).map(String);
      if (key==='statut') html += `<label class="mi ${!sel.length?'pick':''}"><input type="radio" data-opt="" ${!sel.length?'checked':''}> Aucun (Backlog)</label>`;
      html += optionsFor(key).map(o=>{ const on = sel.includes(String(o.v));

        <span class="lnk" data-mg>⚙ Gérer les valeurs…</span>`;
    }
    return { html, bind: el=>{
      const back = el.querySelector('[data-back]'); if (back) back.onclick = ()=>{ menu.build = fieldPicker(cardId); renderMenu(); };
      el.querySelectorAll('[data-opt]').forEach(i=>i.onchange = ()=>{
        const cur = index.get(cardId); if (!cur) return;
        const raw = i.dataset.opt;
        if (key==='statut' && raw===''){ update(cur,{statut:null}); return; }
        const v = key==='responsables' ? +raw : raw;

        if (!isMulti(key)) closeMenu();
      });
      const dt = el.querySelector('#mn-date'); if (dt) dt.onchange = ()=>{ const v=dt.value, cur=index.get(cardId); if(cur) update(cur,{echeance: v ? Date.UTC(+v.slice(0,4), +v.slice(5,7)-1, +v.slice(8,10))/1000 : null}); };
      const cl = el.querySelector('[data-clr]'); if (cl) cl.onclick = ()=>{ const cur=index.get(cardId); if(cur) update(cur,{echeance:null}); closeMenu(); };
      const add = ()=>{ const inp = el.querySelector('#mn-new'); const v = inp.value; inp.value=''; const cur=index.get(cardId); if (cur && v.trim()) createAndSet(cur, key, v); };
      const ab = el.querySelector('#mn-add'); if (ab){ ab.onclick = add; el.querySelector('#mn-new').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } }; }
      const mg = el.querySelector('[data-mg]'); if (mg) mg.onclick = ()=>{ closeMenu(); openManage(key); };
    }};
  };
}
function filterMenu(f){

    const html = `<div class="mh">${f.label}</div>` + (opts.map(o=>`<label class="mi"><input type="checkbox" data-fo="${esc(o)}" ${F[f.id].includes(o)?'checked':''}> ${tag(o, f.key==='prio'?'prio':'')}</label>`).join('') || '<div class="mh" style="text-transform:none">Aucune valeur</div>')
      + `<div class="sep"></div>${F[f.id].length?'<span class="lnk" data-fclr>Tout décocher</span>':''}<span class="lnk" data-mg>⚙ Gérer les valeurs…</span>`;
    return { html, bind: el=>{
      el.querySelectorAll('[data-fo]').forEach(i=>i.onchange=()=>{ const v=i.dataset.fo; F[f.id] = i.checked ? [...F[f.id].filter(x=>x!==v), v] : F[f.id].filter(x=>x!==v); render(); });
      const c = el.querySelector('[data-fclr]'); if (c) c.onclick = ()=>{ F[f.id]=[]; render(); };
      el.querySelector('[data-mg]').onclick = ()=>{ closeMenu(); openManage(f.field||f.key); };

function filterOptions(f){
  if (f.key==='personnes') return [...new Set([...team.map(t=>t.label), ...records.flatMap(r=>L(r,'personnes'))])].sort((a,b)=>a.localeCompare(b,'fr'));
  const fld = FIELDS.find(x=>x.key===f.key);
  return choicesFor(f.key, (fld && fld.fallback) || []);
}

/* ============ GÉRER LES VALEURS (ajouter / renommer / supprimer) ============ */
function manageKeys(){ return FIELDS.filter(f=>f.kind!=='date' && fieldOn(f) && (f.key!=='responsables' || (map.responsables && teamTable))); }
function openManage(key){ manage = {key: key==='personnes' ? 'responsables' : key, confirm:null, msg:''}; closeMenu(); renderManage(); }
function closeManage(){ manage = null; $('modal').style.display='none'; }
function usage(key, v){
  if (key==='responsables') return records.filter(r=>refIds(r.responsables).includes(v)).length;
  return records.filter(r=>L(r,key).includes(v)).length;
}
function renderManage(){
  const m = $('modal');
  if (!manage){ m.style.display='none'; return; }
  const keys = manageKeys();
  if (!keys.find(k=>k.key===manage.key)) manage.key = keys[0] && keys[0].key;
  if (!manage.key){ m.style.display='block'; m.innerHTML = '<h3>Gérer les valeurs</h3><div class="mmsg">Aucun champ à gérer : associez des colonnes au widget.</div><div class="mrow"><button class="btn ghost" id="mg-close">Fermer</button></div>'; $('mg-close').onclick=closeManage; return; }
  const key = manage.key, people = key==='responsables';
  const vals = people ? team.map(t=>({v:t.id,label:t.label})) : optionsFor(key);
  m.style.display = 'block';
  m.innerHTML = `<h3>Gérer les valeurs <button class="close" id="mg-x" style="float:right">×</button></h3>
    <div class="mrow"><label>Champ</label><select id="mg-field">${keys.map(k=>`<option value="${k.key}" ${k.key===key?'selected':''}>${k.label}</option>`).join('')}</select></div>
    ${manage.msg?`<div class="mmsg">${esc(manage.msg)}</div>`:''}
    ${vals.map(o=>`<div class="mrow"><input type="text" data-ren="${esc(o.v)}" value="${esc(o.label)}"><span class="cnt">${usage(key,o.v)} carte(s)</span>
      <button class="btn ${manage.confirm===String(o.v)?'':'ghost'}" data-del="${esc(o.v)}" style="${manage.confirm===String(o.v)?'background:#c0392b;border-color:#c0392b':''}">${manage.confirm===String(o.v)?'Confirmer ?':'🗑'}</button></div>`).join('') || '<div class="none">Aucune valeur.</div>'}
    <div class="mrow"><input type="text" id="mg-new" placeholder="${people?'Nouvelle personne…':'Nouvelle valeur…'}" autocomplete="off"><button class="btn" id="mg-add">Ajouter</button></div>
    <div class="hint">${people ? 'Les personnes sont celles de la table « '+esc(teamTable)+' ». Supprimer une personne la retire aussi de toutes les cartes.' : 'Les valeurs sont les choix de la colonne Grist. Renommer met aussi à jour toutes les cartes ; supprimer retire la valeur de toutes les cartes. Il faut le droit de modifier la structure du document.'}</div>
    <div class="mrow"><span class="grow"></span><button class="btn ghost" id="mg-close">Fermer</button></div>`;
  $('mg-x').onclick = closeManage; $('mg-close').onclick = closeManage;
  $('mg-field').onchange = e=>{ manage = {key:e.target.value, confirm:null, msg:''}; renderManage(); };
  const addV = ()=>{ const v = $('mg-new').value.trim(); if (v) runManage(()=>mgAdd(key,v)); };
  $('mg-add').onclick = addV; $('mg-new').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); addV(); } };
  m.querySelectorAll('[data-ren]').forEach(i=>i.onchange=()=>{ const old = people ? +i.dataset.ren : i.dataset.ren, nv = i.value.trim(); if (nv && nv!==String(people?teamById[old]:old)) runManage(()=>mgRename(key,old,nv)); else renderManage(); });
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const v = people ? +b.dataset.del : b.dataset.del;
    if (manage.confirm===String(v)){ runManage(()=>mgDelete(key,v)); }
    else { manage.confirm = String(v); manage.msg = usage(key,v) ? `${usage(key,v)} carte(s) utilisent cette valeur : elle leur sera retirée. Cliquez à nouveau pour confirmer.` : 'Cliquez à nouveau pour confirmer.'; renderManage(); }

}
async function runManage(fn){
  try { await fn(); manage.msg = 'Modification enregistrée.'; }
  catch(e){ manage.msg = 'Impossible : '+((e&&e.message)||e)+' (droit de modifier la structure du document requis).'; }
  manage.confirm = null;
  await reloadMeta(); renderManage();
}
async function mgAdd(key, v){
  if (key==='responsables') return createPerson(v);
  if (meta[key] && meta[key].choices.includes(v)) throw new Error('cette valeur existe déjà');
  await widgetOptsWrite(key, wo=>wo.choices.push(v));
}
function rowsUpdate(key, fn){   // fn(card) -> nouvelle valeur envoyée à Grist, ou undefined si inchangé
  const ids = [], vals = [];
  records.forEach(r=>{ const nv = fn(r); if (nv !== undefined){ ids.push(r.id); vals.push(nv); } });
  return ids.length ? grist.docApi.applyUserActions([['BulkUpdateRecord', host, ids, {[map[key]]: vals}]]) : Promise.resolve();
}
async function mgRename(key, oldV, newV){
  if (key==='responsables'){ await grist.docApi.applyUserActions([['UpdateRecord', teamTable, oldV, {[teamCol]: newV}]]); return; }
  if (meta[key] && meta[key].choices.includes(newV)) throw new Error('cette valeur existe déjà');
  await widgetOptsWrite(key, wo=>{
    wo.choices = wo.choices.map(c=>c===oldV?newV:c);
    if (wo.choiceOptions && oldV in wo.choiceOptions){ wo.choiceOptions[newV] = wo.choiceOptions[oldV]; delete wo.choiceOptions[oldV]; }
  });
  const list = isListCol(key);
  await rowsUpdate(key, r=>{
    const cur = L(r,key); if (!cur.includes(oldV)) return undefined;
    const next = [...new Set(cur.map(x=>x===oldV?newV:x))];
    return list ? ['L',...next] : newV;
  });
  // les couleurs et l'ordre mémorisés suivent la valeur renommée
  let changed = false;
  if (colors.tags[oldV]){ colors.tags[newV]=colors.tags[oldV]; delete colors.tags[oldV]; changed = true; }
  if (colors.groups[oldV]){ colors.groups[newV]=colors.groups[oldV]; delete colors.groups[oldV]; changed = true; }
  if (changed) saveColors();
  for (const m in colOrder){ if ((colOrder[m]||[]).includes(oldV)){ colOrder[m] = colOrder[m].map(x=>x===oldV?newV:x); grist.setOption('order', colOrder); } }
}
async function mgDelete(key, v){
  if (key==='responsables'){
    const list = isListRef();
    await rowsUpdate('responsables', r=>{ const cur = refIds(r.responsables); if (!cur.includes(v)) return undefined; const next = cur.filter(x=>x!==v); return list ? ['L',...next] : 0; });
    await grist.docApi.applyUserActions([['RemoveRecord', teamTable, v]]); return;
  }
  await widgetOptsWrite(key, wo=>{ wo.choices = wo.choices.filter(c=>c!==v); if (wo.choiceOptions) delete wo.choiceOptions[v]; });
  const list = isListCol(key);
  await rowsUpdate(key, r=>{ const cur = L(r,key); if (!cur.includes(v)) return undefined; const next = cur.filter(x=>x!==v); return list ? ['L',...next] : null; });
}

/* ============ COLONNES DU KANBAN (selon la vue) ============ */
// Vue Backlog : colonnes = Prio. Vues Suivi et Mes tâches : colonnes = Statut.
const groupKey = () => mode==='backlog' ? 'prio' : (grp==='prio' ? 'prio' : 'statut');
const orderKey = () => mode==='backlog' ? 'backlog' : (groupKey()==='prio' ? mode+':prio' : mode);   // ordre des colonnes mémorisé par vue et par regroupement
const groupOf = r => String(g(r, groupKey()) || '');
function groupList(){
  const k = groupKey(), fld = FIELDS.find(f=>f.key===k);
  const defaults = k==='prio' ? PRIO_COLORS : STATUT_COLORS;
  const hasDecl = !!(meta[k] && meta[k].choices && meta[k].choices.length);
  const declared = hasDecl ? meta[k].choices : fld.fallback;
  const all = choicesFor(k, fld.fallback).sort((a,b)=>{ const ia=declared.indexOf(a), ib=declared.indexOf(b); return (ia<0?999:ia)-(ib<0?999:ib); });
  const ord = colOrder[orderKey()] || [];
  const rank = n => { const i = ord.indexOf(n); return i>=0 ? i : 1000 + all.indexOf(n); };
  const list = all.map((n,i)=>({name:n, color:colors.groups[n]||defaults[i]||'#999', warn: hasDecl && !declared.includes(n)})).sort((a,b)=>rank(a.name)-rank(b.name));
  if (records.some(r=>inView(r) && !groupOf(r))) list.push({name:'', label: k==='prio'?'Sans priorité':'Sans statut', color:'#bbb'});
  return list;
}
function moveColumn(from, to){
  if (!from || !to || from===to) return;
  const before = groupList().map(x=>x.name).filter(Boolean);
  const names = before.slice(); const fi = names.indexOf(from); if (fi<0) return;
  names.splice(fi,1); const ti = names.indexOf(to);
  names.splice(fi < before.indexOf(to) ? ti+1 : ti, 0, from);
  colOrder[orderKey()] = names; grist.setOption('order', colOrder); render();
}

/* ============ TRI DES CARTES (dans chaque colonne) ============ */
const SORTS = [['prio','Prio'],['echeance','Échéance'],['charge','Charge']];
function sortCards(list){
  const crit = sortPref.filter(s=>s && s.k && map[s.k]);
  const rankOf = (r,k)=>{
    if (k==='echeance'){ const d = toDate(g(r,'echeance')); return d ? +d : null; }
    const v = g(r,k); if (!v) return null;
    const dec = (meta[k] && meta[k].choices && meta[k].choices.length) ? meta[k].choices : FIELDS.find(f=>f.key===k).fallback;
    const i = dec.indexOf(String(v)); return i<0 ? 999 : i;
  };
  return list.slice().sort((a,b)=>{
    for (const s of crit){
      const x = rankOf(a,s.k), y = rankOf(b,s.k);
      if (x===y) continue; if (x==null) return 1; if (y==null) return -1;
      return s.d==='desc' ? y-x : x-y;
    }
    const da = toDate(g(a,'echeance')), db = toDate(g(b,'echeance'));
    return ((da?+da:9e15)-(db?+db:9e15)) || (a.id-b.id);
  });
}
function saveSort(){ sortPref = [0,1,2].map(i=>sortPref[i]||{}); lsSet('sort', sortPref); renderHeader(); renderBoard(); if (menu) renderMenu(); }
function sortMenu(){
  return ()=>{
    sortPref = [0,1,2].map(i=>sortPref[i]||{});
    const row = i=>{ const s = sortPref[i];
      return `<div class="row"><select data-sk="${i}"><option value="">${i?'puis par…':'Trier par…'}</option>${SORTS.filter(([k])=>map[k]).map(([k,l])=>`<option value="${k}" ${s.k===k?'selected':''}>${l}</option>`).join('')}</select><button class="fb" data-sd="${i}" title="Sens du tri">${s.d==='desc'?'↓ décroissant':'↑ croissant'}</button></div>`; };
    return { html: '<div class="mh">Trier les cartes de chaque colonne</div>'+row(0)+row(1)+row(2)+'<div class="sep"></div><span class="lnk" data-sclr>Tri par défaut (échéance)</span>',
      bind: el=>{
        el.querySelectorAll('[data-sk]').forEach(x=>x.onchange=()=>{ const i=+x.dataset.sk; sortPref[i] = {k:x.value, d:sortPref[i].d||'asc'}; saveSort(); });
        el.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.sd; sortPref[i] = {k:sortPref[i].k, d:sortPref[i].d==='desc'?'asc':'desc'}; saveSort(); });
        const c = el.querySelector('[data-sclr]'); if (c) c.onclick = ()=>{ sortPref = []; saveSort(); };
      } };
  };
}

/* ============ FILTRAGE ============ */
// Règle Backlog / Suivi : un Statut renseigné = Suivi ; pas de Statut = Backlog
function inView(r){
  const hasStatut = !!g(r,'statut');
  return mode==='backlog' ? !hasStatut : hasStatut;
}
function passes(r){
  if (!inView(r)) return false;
  if (mode==='perso' && moi && !L(r,'personnes').includes(moi)) return false;     // "Mes tâches" : mes tâches uniquement
  for (const f of FILTERS){
    if (f.skipIn===mode) continue;
    const sel = F[f.id]; if (!sel.length) continue;
    const vals = L(r, f.key);
    if (!sel.some(x=>vals.includes(x))) return false;
  }
  if (mode!=='backlog' && (F.from||F.to)){
    const d = toDate(g(r,'echeance')); if (!d) return false;
    if (F.from && dayStart(d) < dayStart(F.from)) return false;
    if (F.to && dayStart(d) > dayStart(F.to)) return false;
  }
  if (F.q){
    const hay = [r.titre,g(r,'description'),...L(r,'personas'),...L(r,'themes'),...L(r,'sources'),...L(r,'produit'),...L(r,'etiquettes'),...L(r,'personnes'),g(r,'checklist')].join(' ').toLowerCase();
    if (!hay.includes(F.q.toLowerCase())) return false;
  }
  return true;
}

function renderWarn(){
  const parts = [];
  if (map){
    const total = records.length, shown = records.filter(passes).length, inv = records.filter(inView).length;
    if (!total || !shown){
      let t = `${total} ligne(s) reçue(s) de « ${esc(host||'?')} » · ${shown} affichée(s) dans cette vue`;
      if (inv<total) t += ` · ${total-inv} dans l'autre vue (${mode==='backlog'?'Suivi':'Backlog'}) à cause du Statut`;
      if (inv>shown) t += ` · ${inv-shown} masquée(s) par les filtres`;
      if (!total) t += ` — <b>Grist n'envoie aucune ligne</b> : vérifiez qu'aucun filtre n'est actif sur le widget (bouton « Enregistrer » / ↺ en haut à droite de la section).`;
      else t += ` (le Backlog affiche les cartes sans Statut, le Suivi celles qui ont un Statut).`;
      parts.push(`<div class="info">${t} <span style="opacity:.6">(widget v${VERSION})</span></div>`);
    }
  }
  if (histNote) parts.push(`<div class="warn">${esc(histNote)}</div>`);
  $('warn').innerHTML = parts.join('');
}
async function loadTableCount(){
  try { const t = await grist.docApi.fetchTable(host); tableCount = (t.id||[]).length; } catch(e){ tableCount = 'erreur : '+((e&&e.message)||e); }

function renderDiag(){
  const d = $('diag');
  if (!diagOpen){ d.style.display='none'; return; }
  d.style.display='block';
  const first = records[0] ? JSON.stringify(records[0]) : '(aucune)';
  const active = FILTERS.filter(f=>F[f.id].length).map(f=>f.id+'='+F[f.id].join('|')).join(', ') || 'aucun';
  d.textContent = [
    'Version du widget : '+VERSION, 'Table du widget : '+host, 'Vue : '+mode+' | filtres : '+active,

/* ============ RENDU : cartes et colonnes ============ */
function dateBadge(r){
  const d = toDate(g(r,'echeance')); if(!d) return '';
  const statut = g(r,'statut') || '';
  let cls = 'd-grey';
  if (STATUT_TERMINE.includes(statut)) cls = 'd-ok';
  else {
    const diff = Math.round((dayStart(d)-dayStart(new Date()))/86400000);
    if (diff <= thr.red) cls = 'd-red'; else if (diff <= thr.orange) cls = 'd-orange';
  }
  return `<span class="date ${cls}">${fmtDate(d)}${cls==='d-ok'?' ✔':''}</span>`;
}
function cardHtml(r){
  let tags = '';
  if (mode!=='backlog' && g(r,'prio')) tags += tagX(g(r,'prio'),'prio');
  if (g(r,'charge')) tags += tagX(g(r,'charge'),'charge');
  ['etiquettes','personas','produit','themes','sources'].forEach(k=>L(r,k).forEach(t=>tags+=tagX(t,k)));
  tags += `<button class="cplus" data-cplus="1" data-anchor="cp-${r.id}" title="Modifier le statut, la prio ou la charge">＋</button>`;
  let m = dateBadge(r);
  const cl = checklistCount(g(r,'checklist'));
  if (cl.total) m += `<span>☑ ${cl.done}/${cl.total}</span>`;
  const pj = refIds(g(r,'pj')).length; if (pj) m += `<span>📎${pj}</span>`;
  const cc = commentCount(r); if (cc) m += `<span>🗨️${cc}</span>`;
  if (mode==='backlog' && (map.votes||map.votants)) m += `<button class="vote ${hasVoted(r)?'on':''}" data-vote="1" title="${map.votants?(hasVoted(r)?'Retirer mon vote':'Voter (un vote par personne)'):'Voter'}">👍 ${voteCount(r)}</button>`;
  if (mode==='backlog') m += `<button class="tosuivi" data-tosuivi="1" title="Passer dans le suivi (statut A faire)">➜ Suivi</button>`;
  if (mode!=='backlog' && g(r,'statut')==='A faire') m += `<button class="tobacklog" data-tobacklog="1" title="Remettre dans le backlog (statut vidé)">⬅ Backlog</button>`;
  const av = L(r,'personnes').map(n=>`<div class="av" title="${esc(n)}">${esc(initials(n))}</div>`).join('');
  return `<div class="card${r.id===openId?' open':''}" draggable="true" data-id="${r.id}">
    <div class="tags">${tags}</div>
    <div class="title">${esc(r.titre)||'<i>(sans titre)</i>'}</div>
    <div class="meta">${m}<div class="avatars">${av}</div></div></div>`;
}
function renderBoard(){
  const board = $('board');
  if (!map){ board.innerHTML = '<div class="msg">Associez au minimum les colonnes <b>Titre</b>, <b>Statut</b> et <b>Priorité</b> dans la configuration du widget.</div>'; return; }
  const left = board.scrollLeft, top = board.scrollTop;
  const shown = records.filter(passes);
  board.innerHTML = groupList().map(gr=>{
    const cards = sortCards(shown.filter(r=>groupOf(r)===gr.name));
    return `<div class="col" data-group="${esc(gr.name)}">
      <h2 ${gr.name?'draggable="true"':''} data-colh="${esc(gr.name)}" title="Glisser pour déplacer la colonne"><span class="grip">⋮⋮</span><span class="dot" style="background:${gr.color}"></span>${esc(gr.label||gr.name)}${gr.warn?'<span class="warnc" title="Valeur absente des choix de la colonne Grist : saisie par erreur ? Corrigez-la dans la table.">⚠</span>':''}<span class="count">${cards.length}</span></h2>
      ${cards.map(cardHtml).join('')}
      ${gr.name?`<button class="add" data-add="${esc(gr.name)}">+ Nouvelle carte</button>`:''}</div>`;
  }).join('');
  board.scrollLeft = left; board.scrollTop = top;
  wire();
}
function render(){
  try { rebuild(); renderHeader(); renderWarn(); renderBoard(); renderPanel(); renderFiche(); renderManage(); renderMenu(); renderDiag(); $('err').innerHTML=''; }
  catch(e){ showError(e); }
}
function rebuild(){ index = new Map(records.map(r=>[r.id,r])); }

/* ---- Panneau de personnalisation des couleurs ---- */
function saveColors(){ grist.setOption('colors', colors); }
function renderPanel(){

  const groups = groupList().filter(x=>x.name);
  const tagVals = [...new Set(FIELDS.filter(f=>f.kind!=='date'&&f.key!=='responsables'&&f.key!=='statut').flatMap(f=>records.flatMap(r=>L(r,f.key))))].sort((a,b)=>a.localeCompare(b,'fr'));
  p.innerHTML = `<button class="close" id="pclose">×</button><b>Personnalisation</b>

    <div style="font-size:11px;color:#666">Pour changer l'ordre, faites glisser le titre d'une colonne.</div>
    ${groups.map(gr=>`<div class="row"><input type="color" data-grp="${esc(gr.name)}" value="${gr.color.length===7?gr.color:'#999999'}"> ${esc(gr.name)}</div>`).join('')}
    <div class="row"><button id="oreset">Rétablir l'ordre d'origine</button></div>
    <h3>Étiquettes (couleur de base : le fond est éclairci automatiquement)</h3>
    ${tagVals.map(v=>`<div class="row"><input type="color" data-tag="${esc(v)}" value="${colors.tags[v]||defaultTagColors(v,'')[1]}"> ${tag(v)}</div>`).join('')}
    <h3>Alertes d'échéance</h3>
    <div class="row">Orange à <input type="number" id="t-orange" min="0" value="${thr.orange}"> jour(s) ou moins</div>
    <div class="row">Rouge à <input type="number" id="t-red" min="0" value="${thr.red}"> jour(s) ou moins</div>
    <div class="row"><button id="creset">Rétablir les couleurs par défaut</button></div>`;
  $('pclose').onclick = ()=>{ panelOpen=false; renderPanel(); };
  p.querySelectorAll('[data-grp]').forEach(i=>{ i.oninput = ()=>{ colors.groups[i.dataset.grp]=i.value; renderBoard(); }; i.onchange = ()=>saveColors(); });
  p.querySelectorAll('[data-tag]').forEach(i=>{ i.oninput = ()=>{ colors.tags[i.dataset.tag]=i.value; renderBoard(); }; i.onchange = ()=>{ saveColors(); renderPanel(); }; });
  $('oreset').onclick = ()=>{ delete colOrder[orderKey()]; grist.setOption('order', colOrder); render(); };
  $('t-orange').onchange = e=>{ thr.orange=+e.target.value; grist.setOption('orange',thr.orange); renderBoard(); };
  $('t-red').onchange = e=>{ thr.red=+e.target.value; grist.setOption('red',thr.red); renderBoard(); };
  $('creset').onclick = ()=>{ colors={groups:{},tags:{}}; saveColors(); render(); };
}

/* ============ NOUVELLE CARTE ============ */
function closePop(){ $('pop').style.display='none'; }
function openNewPop(group){
  const p = $('pop'); p.style.display='block';
  p.innerHTML = `<b>Nouvelle carte</b> <span class="hint">(${esc(group)})</span>
    <div class="row"><input id="nt" placeholder="Titre de la tâche…" autocomplete="off"></div>
    <div class="row" style="justify-content:flex-end"><button id="ncancel">Annuler</button><button class="primary" id="nok">Créer</button></div>`;
  const ok = async ()=>{
    const t = $('nt').value.trim();
    if (!t) return; closePop();
    const f = {[map.titre]: t, [map[groupKey()]]: group};                 // Suivi : colonne = Statut ; Backlog : colonne = Prio
    if (mode!=='backlog' && groupKey()==='prio' && map.statut) f[map.statut] = STATUT_DEFAUT;   // sinon la carte partirait au Backlog
    const res = await actRes([['AddRecord', host, null, f]]);
    const id = res && res.retValues && res.retValues[0];
    if (typeof id==='number'){
      const h = histActions([{taskId:id, event:'Création', before:'', after:t}]);
      const r2 = h.length ? await actRes(h, true) : null;
      if (r2 && r2.retValues && typeof r2.retValues[0]==='number'){ side.history.fill.add(r2.retValues[0]); loadTable('history'); }
    }
  };
  $('nok').onclick = ok; $('ncancel').onclick = closePop;
  $('nt').onkeydown = e=>{ if(e.key==='Enter') ok(); if(e.key==='Escape') closePop(); };
  $('nt').focus();
}

async function downloadAttachment(id){
  try {
    const tok = await grist.docApi.getAccessToken({readOnly:true});
    const a = document.createElement('a');
    a.href = `${tok.baseUrl}/attachments/${id}/download?auth=${encodeURIComponent(tok.token)}`; a.target='_blank'; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
  } catch(e){ alert("Ouverture impossible : "+((e&&e.message)||e)); }

function sigOf(r){
  return JSON.stringify([metaTick, side.comments.tick, side.history.tick, moi, r.titre, g(r,'statut'), g(r,'prio'), g(r,'charge'), g(r,'description'), g(r,'checklist'), g(r,'echeance'), g(r,'responsables'), g(r,'personnes'), g(r,'pj'), g(r,'votes'), g(r,'votants'),

function summaryHtml(r){
  const sg = (lbl, inner) => `<div class="sg"><div class="lbl">${lbl}</div><div class="vals">${inner}</div></div>`;
  let h = '';
  FIELDS.forEach(f=>{
    if (!fieldOn(f)) return;
    if (f.key==='statut' || f.key==='prio' || f.key==='charge'){
      const v = g(r,f.key); if (v) h += sg(f.label, tagX(v, f.key));
    } else if (f.kind==='tags'){
      const l = L(r,f.key); if (l.length) h += sg(f.label, l.map(t=>tagX(t,f.key)).join(''));
    } else if (f.key==='responsables'){
      const ids = refIds(r.responsables), names = map.responsables ? ids.map(id=>[id, teamById[id]||('#'+id)]) : L(r,'personnes').map(n=>[null,n]);
      if (names.length) h += sg('Responsables', names.map(([id,n])=>`<span class="chip"><span class="av">${esc(initials(n))}</span>${esc(n)}${id!=null?`<span class="x" data-rmresp="${id}" title="Retirer">×</span>`:''}</span>`).join(''));
    } else if (f.key==='echeance'){
      const d = toDate(g(r,'echeance')); if (d) h += sg('Échéance', dateBadge(r) + `<span class="none">${esc(d.toLocaleDateString('fr-FR'))}</span>`);
    }
  });
  return h || '<span class="none">Aucune valeur : utilisez les boutons ci-dessus.</span>';
}
function historyHtml(r){
  const S = side.history;
  if (S.ok===null) return '<div class="none">Chargement…</div>';
  if (S.ok===false) return `<div class="none">Table « ${TABLES.history.table} » inutilisable (${esc(S.note)}). Voir le guide.</div>`;
  const list = historyOf(r.id).sort((a,b)=>(a.date&&b.date) ? (b.date-a.date) : (b.id-a.id));
  if (!list.length) return '<div class="none">Aucun changement enregistré.</div>';
  return list.slice(0,40).map(h=>{
    const ev = h.event==='Création' ? 'Création de la tâche' : `${esc(h.event)} : <span class="hv">${esc(h.before||'∅')}</span> → <span class="hv">${esc(h.after||'∅')}</span>`;
    return `<div class="hl"><span class="hd">${h.date?esc(fmtDateTime(h.date)):''}</span> · <b>${esc(who(h.author||h.email)||'—')}</b> · ${ev}</div>`;
  }).join('') + (list.length>40 ? `<div class="none">… et ${list.length-40} entrée(s) plus anciennes</div>` : '') +
    '<div class="none" style="margin-top:6px">Seuls les changements faits depuis ce widget sont enregistrés.</div>';
}
function commentsHtml(r){

  if (S.ok === null) return '<div class="none">Chargement…</div>';
  const list = commentsOf(r.id).sort((a,b)=>(a.date&&b.date) ? (a.date-b.date) : (a.id-b.id));
  const kids = pid => list.filter(c=>(c.parent||0)===pid);
  const one = c=>{ const nm = who(c.author||c.email); return `<div class="cm"><div class="av" title="${esc(nm)}">${esc(initials(nm||'?'))}</div><div class="cb">
      <div class="ch"><b>${esc(nm||'Anonyme')}</b>${c.date?' · '+esc(fmtDateTime(c.date)):''}</div>

  return `${top.map(one).join('') || '<div class="none">Aucun commentaire.</div>'}
    <div style="margin-top:12px"><textarea class="cmt" data-draft="new" placeholder="Écrire un commentaire… (@ pour citer quelqu'un)">${esc(drafts['new']||'')}</textarea>
      <div class="row"><button class="btn ghost" data-at="new" data-anchor="at-new">@ Citer</button><span class="grow"></span><button class="btn" id="cm-send">Publier</button></div>

  if (map.checklist){
    const edit = fn => { const c=cur(); if(!c) return; const {lines} = parseChecklist(g(c,'checklist')); fn(lines); update(c,{checklist: lines.join('\n')}); };
    f.querySelectorAll('[data-cl-toggle]').forEach(c=>c.onchange=()=>edit(lines=>{ const i=+c.dataset.clToggle; lines[i] = lines[i].replace(/\[( |x|X)\]/, c.checked?'[x]':'[ ]'); }));
    f.querySelectorAll('[data-cl-text]').forEach(t=>t.onchange=()=>edit(lines=>{
      const i=+t.dataset.clText, v=t.value.trim();
      if (!v) lines.splice(i,1); else lines[i] = lines[i].replace(CL_RE, (m,pre,x)=>`${pre}[${x}] ${v}`);
    }));
    f.querySelectorAll('[data-cl-del]').forEach(b=>b.onclick=()=>edit(lines=>lines.splice(+b.dataset.clDel,1)));
    const addItem = ()=>{
      const v=$('cl-add').value.trim(); if(!v) return;
      edit(lines=>{ while(lines.length && lines[lines.length-1].trim()==='') lines.pop(); lines.push('- [ ] '+v); });
      setTimeout(()=>{ const e=$('cl-add'); if(e) e.focus(); }, 0);
    };
    $('cl-addbtn').onclick = addItem;
    $('cl-add').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); addItem(); } };
  }

  if (map.pj){
    f.querySelectorAll('[data-dl]').forEach(a=>a.onclick=()=>downloadAttachment(+a.dataset.dl));
    f.querySelectorAll('[data-rmatt]').forEach(b=>b.onclick=()=>{
      const c=cur(); if(!c) return; const rid=+b.dataset.rmatt, ids=refIds(g(c,'pj')).filter(i=>i!==rid);
      update(c,{pj:ids},{pj:['L',...ids]},[{event:'Pièce jointe', before:(attMeta[rid]&&attMeta[rid].name)||('Fichier '+rid), after:'retirée'}]);
    });
  }

  /* commentaires */
  f.querySelectorAll('[data-draft]').forEach(t=>t.oninput = ()=>{ drafts[t.dataset.draft] = t.value; });
  f.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>openMenu(b.dataset.anchor, atMenu(b.dataset.at)));
  f.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{ const el=$('rp-'+b.dataset.reply); el.style.display = el.style.display==='none' ? 'block' : 'none'; const ta=el.querySelector('textarea'); if (el.style.display==='block') ta.focus(); });
  f.querySelectorAll('[data-send]').forEach(b=>b.onclick=async()=>{ const k='reply-'+b.dataset.send; const t=drafts[k]; if (await addComment(id, +b.dataset.send, t)){ delete drafts[k]; refreshFiche(); } });
  f.querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>deleteComment(+b.dataset.delc));
  const send = $('cm-send'); if (send) send.onclick = async()=>{ if (await addComment(id, 0, drafts['new'])){ delete drafts['new']; refreshFiche(); } };
}

/* ============ INTERACTIONS : cartes et colonnes ============ */
function cardOf(el){ const c = el.closest('.card'); return c ? index.get(+c.dataset.id) : null; }
const isColDrag = e => e.dataTransfer && [...(e.dataTransfer.types||[])].includes('application/x-col');
function wire(){
  let dragId = null;
  document.querySelectorAll('.card').forEach(c=>{
    c.ondragstart = e=>{ dragId=+c.dataset.id; c.classList.add('dragging'); e.dataTransfer.setData('text/plain',String(dragId)); };
    c.ondragend = ()=>c.classList.remove('dragging');
    c.onclick = e=>{
      if (e.target.closest('button,.x')) return;
      const id = +c.dataset.id;
      grist.setCursorPos({rowId:id}).catch(()=>{});
      openFiche(id);
    };
  });
  document.querySelectorAll('.col h2[draggable]').forEach(h=>{
    h.ondragstart = e=>{ e.dataTransfer.setData('application/x-col', h.dataset.colh); e.dataTransfer.effectAllowed='move'; };
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.ondragover = e=>{ e.preventDefault(); col.classList.add(isColDrag(e)?'colover':'over'); };
    col.ondragleave = ()=>col.classList.remove('over','colover');
    col.ondrop = e=>{
      e.preventDefault(); col.classList.remove('over','colover');
      if (isColDrag(e)){ moveColumn(e.dataTransfer.getData('application/x-col'), col.dataset.group); return; }
      const r = index.get(+(e.dataTransfer.getData('text/plain') || dragId)); if(!r) return;
      update(r, {[groupKey()]: col.dataset.group || null});
    };
  });
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openNewPop(b.dataset.add));
  document.querySelectorAll('[data-cplus]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const c = cardOf(b); if (c) openMenu(b.dataset.anchor, fieldPicker(c.id)); });
  document.querySelectorAll('.card [data-rm]').forEach(x=>x.onclick=e=>{ e.stopPropagation(); const c=cardOf(x); if (c) removeValue(c, x.dataset.rm, x.dataset.val); });
  document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>castVote(cardOf(b)));
  document.querySelectorAll('[data-tosuivi]').forEach(b=>b.onclick=()=>update(cardOf(b), {statut:'A faire'}));
  document.querySelectorAll('[data-tobacklog]').forEach(b=>b.onclick=()=>update(cardOf(b), {statut:null}));
}
document.addEventListener('click', e=>{
  if (!menu) return;
  // le menu est reconstruit pendant le clic : on regarde le chemin de l'événement, pas l'élément cliqué (déjà retiré de la page)
  const path = (e.composedPath && e.composedPath()) || [];
  const inside = path.some(n=>n && (n.id==='menu' || (n.dataset && n.dataset.anchor)));
  if (!inside) closeMenu();
});
document.addEventListener('keydown', e=>{
  if (e.key!=='Escape') return;
  if (menu) closeMenu(); else if (manage) closeManage(); else if ($('pop').style.display==='block') closePop(); else closeFiche();
});

/* ============ GRIST ============ */
grist.ready({ columns: COLS, requiredAccess: 'full', allowSelectBy: true });
grist.onOptions(o=>{
  if (o && o.mode) mode = o.mode;
  if (o && o.group) grp = o.group;
  if (o && o.colors) colors = {groups:o.colors.groups||{}, tags:o.colors.tags||{}};
  if (o && o.order) colOrder = o.order;
  if (o && o.orange != null) thr.orange = Number(o.orange);
  if (o && o.red != null) thr.red = Number(o.red);
  render();
});
let commentsStarted = false;
grist.onRecords(async (recs, mappings)=>{
  nCalls++; lastCall = new Date().toLocaleTimeString('fr-FR')+' – '+((recs||[]).length)+' ligne(s)';
  map = mappings ? {...mappings} : null;
  if (map && map.responsables) map.personnes = '@Equipe';   // noms toujours déduits de la référence (la colonne texte éventuelle est ignorée)
  if (!host){ try { host = await grist.selectedTable.getTableId(); } catch(e){ host = null; } }
  rawRecs = recs || []; rawFirst = rawRecs[0] || null;
  ingest();
  ensureMeta();
  if (!commentsStarted && host){ commentsStarted = true; loadSide(); setInterval(()=>{ if (!document.hidden) loadSide(); }, SIDE_POLL_MS); }
});
</script>

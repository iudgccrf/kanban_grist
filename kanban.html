<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban Grist</title>
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<style>
  :root { --bg:#f4f5f7; --col:#eeeef0; --card:#fff; --txt:#161616; --muted:#666; --accent:#3a55d8; --accent-bg:#e3e8fb; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Marianne","Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--txt); font-size:13px; display:flex; flex-direction:column; overflow:hidden; }
  header { flex:none; background:#fff; border-bottom:1px solid #ddd; padding:6px 12px; display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .hrow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  header select, header input { font:inherit; padding:4px 6px; border:1px solid #ccc; border-radius:4px; background:#fff; max-width:150px; }
  header input[type=search] { width:140px; }
  .flbl { color:var(--muted); font-size:12px; }
  header label { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:3px; }
  header button, .fb { font:inherit; border:1px solid #ccc; background:#fff; border-radius:4px; padding:4px 8px; cursor:pointer; }
  .fb.active { background:var(--accent-bg); border-color:var(--accent); color:#2b3a9a; font-weight:700; }
  header .spacer { flex:1; }
  #bands { flex:none; }
  /* le tableau occupe toute la hauteur : la barre de défilement horizontale reste toujours visible en bas */
  #board { flex:1; min-height:0; display:flex; gap:12px; padding:12px 12px 4px; align-items:flex-start; overflow-x:scroll; overflow-y:auto; }
  #board::-webkit-scrollbar { height:16px; width:12px; }
  #board::-webkit-scrollbar-track { background:#e4e6ec; border-radius:8px; }
  #board::-webkit-scrollbar-thumb { background:#9aa3c7; border-radius:8px; border:3px solid #e4e6ec; }
  #board::-webkit-scrollbar-thumb:hover { background:var(--accent); }
  #board { scrollbar-color:#9aa3c7 #e4e6ec; scrollbar-width:auto; }
  .col { flex:0 0 280px; background:var(--col); border-radius:6px; padding:8px; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .col.over { outline:2px dashed var(--accent); }
  .col.colover { outline:3px solid var(--accent); }
  .col h2 { margin:2px 4px 8px; font-size:15px; display:flex; align-items:center; gap:8px; cursor:grab; }
  .col h2 .grip { color:#aaa; font-size:12px; letter-spacing:-2px; }
  .dot { width:14px; height:14px; border-radius:50%; flex:none; }
  .count { margin-left:auto; background:#dde0e6; border-radius:10px; font-size:11px; padding:1px 7px; }
  .card { background:var(--card); border-radius:4px; padding:9px 10px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.18); cursor:pointer; }
  .card:hover { box-shadow:0 2px 6px rgba(0,0,0,.28); }
  .card.dragging { opacity:.4; }
  .card.open { outline:2px solid var(--accent); }
  .tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .tag { font-size:11px; font-weight:700; padding:2px 6px; border-radius:3px; white-space:nowrap; }
  .tag .x { margin-left:3px; opacity:.45; cursor:pointer; }
  .tag .x:hover { opacity:1; }
  .cplus { font-size:11px; padding:2px 8px; border:1px dashed #aab; border-radius:3px; color:#667; cursor:pointer; white-space:nowrap; background:none; font-family:inherit; }
  .cplus:hover { background:#eef1ff; color:var(--accent); border-color:var(--accent); }
  .title { font-size:14px; line-height:1.3; margin:2px 0 8px; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
  .date { font-weight:700; padding:1px 6px; border-radius:3px; }
  .d-ok { background:#c9f0d4; color:#1d6b35; }
  .d-orange { background:#ffe0b8; color:#9a4f00; }
  .d-red { background:#ffc9cc; color:#a3121d; }
  .d-grey { background:#e6e8ec; color:#555; }
  .avatars { margin-left:auto; display:flex; }
  .av { width:26px; height:26px; border-radius:50%; background:#c99a14; color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-left:-6px; border:2px solid #fff; flex:none; }
  .add { color:var(--accent); font-weight:600; cursor:pointer; padding:6px 4px; background:none; border:0; font:inherit; font-weight:600; }
  .vote, .tosuivi, .tobacklog { border:1px solid #ccc; background:#fafafa; border-radius:12px; padding:1px 8px; cursor:pointer; font:inherit; font-size:12px; }
  .vote:hover { background:#eaf0ff; }
  .tosuivi, .tobacklog { margin-left:auto; }
  .msg { padding:30px; color:var(--muted); }
  .info { margin:8px 12px 0; padding:5px 10px; background:#eef2ff; border:1px solid #cdd6f7; border-radius:4px; font-size:12px; color:#2b3a7a; }
  #diag { margin:8px 12px 0; padding:8px 10px; background:#fff; border:1px solid #bbb; border-radius:4px; font:11px/1.4 Consolas,monospace; white-space:pre-wrap; word-break:break-all; user-select:all; max-height:220px; overflow:auto; }
  .err { margin:8px 12px 0; padding:6px 10px; background:#ffd9dc; border:1px solid #e59aa1; border-radius:4px; font-size:12px; }
  .warn { margin:8px 12px 0; padding:6px 10px; background:#fff4d6; border:1px solid #f0d58a; border-radius:4px; font-size:12px; }

  /* panneau des couleurs */
  #panel { display:none; position:fixed; top:0; right:0; bottom:0; width:290px; background:#fff; border-left:1px solid #ccc; box-shadow:-4px 0 12px rgba(0,0,0,.15); z-index:20; overflow-y:auto; padding:12px; }
  #panel h3 { margin:14px 0 6px; font-size:13px; }
  #panel .row { display:flex; align-items:center; gap:8px; margin:4px 0; }
  #panel input[type=color] { width:34px; height:24px; padding:0; border:1px solid #ccc; border-radius:3px; background:none; cursor:pointer; }
  #panel input[type=number] { width:54px; }
  .close { border:0; background:none; font-size:22px; cursor:pointer; line-height:1; color:#555; }
  #panel .close { float:right; }

  /* fiche de la carte */
  #fiche { display:none; position:fixed; top:0; right:0; bottom:0; width:min(620px,100vw); background:#fff; border-left:1px solid #ccc; box-shadow:-6px 0 18px rgba(0,0,0,.2); z-index:20; overflow-y:auto; }
  #fiche .fhead { position:sticky; top:0; z-index:3; background:#fff; display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:1px solid #eee; }
  #fiche .ftitle { flex:1; min-width:0; font:inherit; font-size:23px; font-weight:800; line-height:1.2; border:1px solid transparent; border-radius:6px; padding:6px 8px; background:transparent; }
  #fiche .ftitle:hover, #fiche .ftitle:focus { border-color:#ccc; background:#fff; }
  #fiche .fbody { padding:10px 20px 40px; }
  .tb { display:flex; flex-wrap:wrap; gap:6px; }
  .dd { font:inherit; font-size:12px; font-weight:600; padding:6px 10px; border:1px solid #c9d0ea; border-radius:6px; background:#f4f6ff; color:#2b3a9a; cursor:pointer; white-space:nowrap; }
  .dd:hover, .dd.on { background:var(--accent-bg); border-color:var(--accent); }
  .dd.vote2 { background:#fff; border-color:#ccc; color:#333; margin-left:auto; }
  .summ { display:flex; flex-wrap:wrap; gap:6px 22px; margin:12px 0 4px; }
  .sg .lbl { font-size:11px; color:var(--muted); margin-bottom:3px; font-weight:600; }
  .sg .vals { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .sg .tag { font-size:12px; padding:3px 8px; border-radius:4px; }
  .none { color:#999; font-size:12px; }
  #fiche .sec { margin:18px 0 0; }
  #fiche .sh { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; margin:0 0 8px; }
  #fiche .sh .sub { margin-left:auto; font-weight:400; font-size:12px; color:var(--muted); }
  #fiche .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  #fiche .grow, .grow { flex:1; }
  #fiche input[type=text], #fiche textarea, #modal input[type=text], #modal select, #menu input[type=text], #menu input[type=date] { font:inherit; padding:7px 9px; border:1px solid #ccc; border-radius:6px; background:#fff; min-width:0; max-width:100%; }
  #fiche textarea { width:100%; resize:vertical; line-height:1.45; }
  #fiche textarea.desc { min-height:190px; }
  .mdview { border:1px solid transparent; border-radius:6px; padding:8px; min-height:48px; cursor:text; line-height:1.45; overflow-wrap:anywhere; }
  .mdview:hover { background:#f7f8fc; border-color:#dde3f5; }
  .mdview p { margin:0 0 8px; } .mdview ul, .mdview ol { margin:4px 0 8px 22px; padding:0; } .mdview a { color:var(--accent); text-decoration:underline; }
  .mdbar { display:flex; gap:6px; margin:0 0 6px; flex-wrap:wrap; align-items:center; }
  .mdbar .btn { padding:2px 10px; }
  #fiche textarea.cmt { min-height:58px; }
  .btn { font:inherit; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; padding:6px 12px; cursor:pointer; }
  .btn.soft { background:var(--accent-bg); color:#2b3a9a; border-color:var(--accent-bg); font-weight:600; }
  .btn.ghost { background:#fff; color:#555; border-color:#ccc; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--accent-bg); border-radius:14px; padding:2px 8px 2px 3px; font-size:12px; }
  .chip .av { margin:0; border:0; width:22px; height:22px; font-size:9px; }
  .chip .x { cursor:pointer; opacity:.5; } .chip .x:hover { opacity:1; }
  .bar { height:7px; background:#e3e6ee; border-radius:4px; overflow:hidden; margin:2px 0 10px; }
  .bar > i { display:block; height:100%; background:var(--accent); transition:width .2s; }
  .ci { display:flex; align-items:center; gap:9px; margin:4px 0; }
  .ci input[type=checkbox] { width:18px; height:18px; flex:none; cursor:pointer; accent-color:var(--accent); }
  #fiche .ci input[type=text] { flex:1; border-color:transparent; background:transparent; padding:5px 6px; }
  #fiche .ci input[type=text]:hover, #fiche .ci input[type=text]:focus { border-color:#ccc; background:#fff; }
  .ci.done input[type=text] { text-decoration:line-through; color:#888; }
  .ci .del, .att .del, .cm .del { border:0; background:none; cursor:pointer; color:#999; font-size:16px; }
  .ci .del:hover, .att .del:hover, .cm .del:hover { color:#c00; }
  .drop { display:block; border:2px dashed #b9c3ee; background:#f1f4ff; border-radius:8px; padding:16px; text-align:center; color:#33408f; cursor:pointer; }
  .drop.over { background:#dfe6ff; border-color:var(--accent); }
  .drop b { text-decoration:underline; }
  .att { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid #e1e4ec; border-radius:6px; margin-bottom:6px; }
  .att a { flex:1; color:var(--accent); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .att a:hover { text-decoration:underline; }
  .att .sz { color:var(--muted); font-size:11px; }
  /* commentaires */
  .cm { display:flex; gap:9px; margin:10px 0 0; }
  .cm .av { margin:0; border:0; width:28px; height:28px; }
  .cm .cb { flex:1; min-width:0; }
  .cm .ch { font-size:12px; color:var(--muted); } .cm .ch b { color:var(--txt); font-size:13px; }
  .cm .ct { white-space:pre-wrap; word-wrap:break-word; margin:2px 0; line-height:1.4; }
  .cm .ca { font-size:12px; } .cm .ca button { border:0; background:none; color:var(--accent); cursor:pointer; padding:0 8px 0 0; font:inherit; font-size:12px; }
  .cm .rep { margin-left:0; padding-left:14px; border-left:2px solid #e3e6ee; }
  .mention { color:var(--accent); font-weight:700; background:var(--accent-bg); border-radius:3px; padding:0 3px; }

  /* menus déroulants, fenêtres */
  #menu { display:none; position:fixed; z-index:40; background:#fff; border:1px solid #bbb; border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.28); min-width:210px; max-width:300px; max-height:70vh; overflow-y:auto; padding:6px; }
  #menu .mi { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:5px; cursor:pointer; }
  #menu .mi:hover { background:#f1f3fb; }
  #menu .mi.pick { font-weight:600; }
  #menu .mh { font-size:11px; color:var(--muted); padding:4px 8px; text-transform:uppercase; letter-spacing:.03em; }
  #menu .sep { border-top:1px solid #eee; margin:6px 0; }
  #menu .row { display:flex; gap:6px; padding:2px 4px; }
  #menu .row input { flex:1; }
  #menu .lnk { color:var(--accent); cursor:pointer; padding:4px 8px; border-radius:5px; display:block; font-size:12px; } #menu .lnk:hover { background:#f1f3fb; }
  #modal { display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%); width:min(520px,96vw); max-height:80vh; overflow-y:auto; background:#fff; border:1px solid #aaa; border-radius:10px; box-shadow:0 10px 34px rgba(0,0,0,.35); z-index:50; padding:14px 16px; }
  #modal h3 { margin:0 0 10px; font-size:15px; }
  #modal .mrow { display:flex; align-items:center; gap:8px; margin:5px 0; }
  #modal .mrow input { flex:1; }
  #modal .cnt { color:var(--muted); font-size:11px; white-space:nowrap; }
  #modal .mmsg { margin:8px 0; font-size:12px; padding:6px 8px; background:#fff4d6; border-radius:5px; }
  #modal .hint { font-size:11px; color:var(--muted); margin-top:8px; }
  #pop { display:none; position:fixed; top:80px; left:50%; transform:translateX(-50%); width:310px; background:#fff; border:1px solid #bbb; border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.3); z-index:30; padding:12px; }
  #pop .row { display:flex; gap:6px; margin:8px 0; }
  #pop input { font:inherit; padding:5px 6px; border:1px solid #ccc; border-radius:4px; flex:1; min-width:0; }
  #pop button { font:inherit; padding:5px 10px; border:1px solid #ccc; border-radius:4px; background:#fff; cursor:pointer; }
  #pop button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #pop .hint { font-size:11px; color:var(--muted); }
  .fmeta { font-size:11px; color:var(--muted); padding:0 20px 2px; margin-top:-4px; }
  .hl { font-size:12px; margin:5px 0; line-height:1.45; color:#333; } .hl .hd { color:var(--muted); } .hl .hv { background:#f1f3f8; border-radius:3px; padding:0 4px; }
  .vote.on, .dd.vote2.on { background:var(--accent-bg); border-color:var(--accent); color:#2b3a9a; font-weight:700; }
  .warnc { color:#b25e00; cursor:help; }
  #menu select { font:inherit; padding:5px 6px; border:1px solid #ccc; border-radius:5px; background:#fff; flex:1; min-width:0; }
  .acts { display:flex; align-items:center; gap:10px; margin:10px 0 0; }
  .btn.danger { background:#c0392b; border-color:#c0392b; color:#fff; }
  #pop select { font:inherit; padding:5px 6px; border:1px solid #ccc; border-radius:4px; flex:1; min-width:0; }
  /* notifications */
  header { padding:0; gap:0; }
  .htop { display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding:7px 12px; background:#fff; border-bottom:1px solid #d7dbe8; }
  .tabs { display:inline-flex; background:var(--accent-bg); border-radius:6px; padding:2px; }
  header .tabb { border:0; background:none; color:#2b3a9a; font-weight:600; padding:5px 11px; border-radius:5px; }
  header .tabb.on { background:var(--accent); color:#fff; }
  .hfilt { display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding:6px 12px; background:#eaecf2; }
  .fgrp { display:inline-flex; flex-wrap:wrap; align-items:center; gap:5px; padding:4px 7px; background:#fff; border:1px solid #d7dbe8; border-radius:7px; }
  .flab { font-size:11px; font-weight:700; color:#3f4770; text-transform:uppercase; letter-spacing:.03em; }
  .hchips { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:5px 12px; background:#f4f5f9; border-top:1px solid #d7dbe8; }
  .fchip { display:inline-flex; align-items:center; gap:3px; background:#fff; border:1px solid #c5c9d6; border-radius:12px; padding:1px 3px 1px 9px; font-size:12px; }
  header .fchip button { border:0; background:none; padding:0 5px; cursor:pointer; color:#555; }
  header .clr { border:0; background:none; text-decoration:underline; color:#2b3a9a; font-size:12px; }
  header .setb { background:#d7dae3; border-color:#d7dae3; }
  header #bell { width:36px; height:32px; padding:0; display:inline-flex; align-items:center; justify-content:center; color:#fff; background:var(--accent); border-color:var(--accent); position:relative; flex:none; }
  header #bell:hover, header #bell.on { background:#2b3a9a; border-color:#2b3a9a; }
  header #bell.has { background:#c2410c; border-color:#c2410c; }
  header #bell.has:hover, header #bell.has.on { background:#9a3412; border-color:#9a3412; }
  .admin { display:inline-flex; align-items:center; gap:4px; padding:3px 6px; background:#e6e8ec; border-radius:6px; }
  .admin .admt { font-size:11px; font-weight:600; color:#555; margin-right:2px; }
  header .admin button { background:transparent; border-color:transparent; color:#444; font-size:12px; padding:3px 6px; }
  header .admin button:hover { background:#fff; border-color:#bbb; }
  #bell .nb { position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:#fff; border:1px solid #9a3412; color:#9a3412; box-sizing:content-box; font-size:11px; font-weight:700; line-height:18px; text-align:center; }
  #notifs { display:none; position:fixed; z-index:30; top:48px; right:10px; width:min(420px,calc(100vw - 20px)); max-height:min(640px,calc(100vh - 60px)); flex-direction:column; background:#fff; border:1px solid #bbb; border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.28); }
  #notifs .nh { display:flex; align-items:center; gap:8px; padding:10px 14px 6px; }
  #notifs .nh b { flex:1; font-size:15px; }
  #notifs .lnkb { border:0; background:none; color:#2b3a9a; text-decoration:underline; cursor:pointer; font:inherit; font-size:12px; padding:4px; }
  #notifs .nf { display:flex; gap:6px; padding:0 14px 8px; border-bottom:1px solid #eee; }
  #notifs .nlist { overflow-y:auto; flex:1; min-height:60px; }
  .ni { display:flex; gap:10px; width:100%; text-align:left; padding:10px 14px; border:0; border-bottom:1px solid #eee; background:#fff; cursor:pointer; font:inherit; color:inherit; }
  .ni:hover { background:#f1f3fb; }
  .ni.unread { background:#f3f5fe; }
  .ni.assign { background:#fff1e3; box-shadow:inset 0 0 0 2px #c2410c; }
  .ni .ic, #ntoast .ic { flex:none; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
  .ni .bd { flex:1; min-width:0; }
  .ni .k { display:block; font-size:11px; color:#595959; margin-bottom:2px; }
  .ni .k b { color:#9a3412; letter-spacing:.02em; }
  .ni .t { display:block; line-height:1.35; overflow-wrap:anywhere; }
  .ni.unread .t { font-weight:700; }
  .ni .d { display:block; font-size:12px; color:#595959; margin-top:3px; overflow-wrap:anywhere; }
  .ni .pt { flex:none; align-self:center; width:9px; height:9px; border-radius:50%; background:var(--accent); }
  #notifs .nfoot { padding:7px 14px; border-top:1px solid #eee; font-size:12px; color:#595959; }
  #ntoast { display:none; position:fixed; z-index:35; bottom:14px; right:10px; width:min(380px,calc(100vw - 20px)); align-items:center; gap:10px; padding:10px 12px; background:#fff1e3; border:2px solid #c2410c; border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.3); cursor:pointer; }
  #ntoast .tx { flex:1; min-width:0; line-height:1.35; overflow-wrap:anywhere; }
  .hlflash { background:#fff3c4 !important; outline:2px solid #d9a400; border-radius:6px; }
  .hpill { border:0; border-radius:3px; background:#4b2e83; color:#fff; font:inherit; font-size:11px; font-weight:700; padding:2px 6px; cursor:pointer; white-space:nowrap; }
  .avatars { border:0; background:none; padding:0 0 0 6px; cursor:pointer; font:inherit; }
  .avatars:hover .av, .avatars:focus-visible .av { box-shadow:0 0 0 2px var(--accent); }
  .av.none { background:#fff; color:#555; border:1px dashed #889; font-size:14px; margin-left:0; }
  /* fiche : cases de propriétés */
  .espill { flex:none; border:2px solid #4b2e83; border-radius:14px; padding:4px 11px; background:#fff; color:#4b2e83; font:inherit; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .espill.hp { background:#4b2e83; color:#fff; }
  #fiche { background:#e9ebf1; }
  #fiche .fhead { background:#fff; border-bottom:1px solid #dcdfe8; }
  #fiche .ftitle { color:#161616; }
  #fiche textarea.ftitle { display:block; font-size:18px; font-weight:800; line-height:1.25; resize:none; overflow:hidden; }
  .ftop { background:#fff; border:1px solid #dcdfe8; border-radius:8px; margin:12px 12px 0; }
  #fiche .fmeta { padding:0 0 8px; margin:0; color:#595959; }

/* ============ OUTILS ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Mise en forme légère de la description : **gras**, listes (- ou 1.), liens http(s). Le texte est d'abord échappé : aucun HTML saisi n'est interprété. */
function mdInline(t){   // t est déjà échappé
  const A = u => `<a href="${u}" target="_blank" rel="noopener noreferrer">`;
  return t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<]+)|\*\*(.+?)\*\*/g, (m, lt, lu, bu, b)=>{
    if (lu) return A(lu)+lt+'</a>';
    if (bu){ const tail = (bu.match(/(?:[.,;:!?)\]]|&quot;|&#39;)+$/)||[''])[0], u = bu.slice(0, bu.length-tail.length); return A(u)+u+'</a>'+tail; }
    return '<strong>'+mdInline(b)+'</strong>';
  });
}
function mdHtml(src){
  const lines = String(src||'').replace(/\r/g,'').split('\n'); let out = '', list = null, para = [];
  const flushP = ()=>{ if (para.length){ out += '<p>'+para.map(l=>mdInline(esc(l))).join('<br>')+'</p>'; para = []; } };
  const closeL = ()=>{ if (list){ out += list==='ul' ? '</ul>' : '</ol>'; list = null; } };
  for (const l of lines){
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)$/))){ flushP(); if (list!=='ul'){ closeL(); out += '<ul>'; list = 'ul'; } out += '<li>'+mdInline(esc(m[1]))+'</li>'; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if (list!=='ol'){ closeL(); out += '<ol>'; list = 'ol'; } out += '<li>'+mdInline(esc(m[1]))+'</li>'; }
    else if (!l.trim()){ flushP(); closeL(); }
    else { closeL(); para.push(l); }
  }
  flushP(); closeL(); return out;
}
function toList(v){
  if (v == null || v === '') return [];

function refIds(v){   // identifiants de lignes d'une colonne Référence / Liste de références

    return x;
  }).filter(x=>typeof x==='number' && x>0);
}

function L(r,k){

}
function hash(s){ let h=0; for (const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function rgb(hex){ const n=parseInt(hex.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function toHex(a){ return '#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''); }
function lighten(hex,p){ return toHex(rgb(hex).map(v=>v*(1-p)+255*p)); }

function defaultTagColors(label,kind){
  if (kind==='prio') for (const [re,col] of PRIO_TAG) if (re.test(label)) return col;
  return PALETTE[hash(label)%PALETTE.length];
}
function tagColors(label,kind){

}
function tag(label, kind){ const c = tagColors(label,kind); return `<span class="tag" style="background:${c[0]};color:${c[1]}">${esc(label)}</span>`; }

function toDate(v){
  if (v == null || v === '') return null;

}
function dayStart(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }

function fmtDateTime(d){ return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function initials(n){ return String(n||'?').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function fmtSize(n){ if(!n) return ''; return n>1048576 ? (n/1048576).toFixed(1)+' Mo' : Math.max(1,Math.round(n/1024))+' Ko'; }

// Grist peut envoyer les lignes avec les noms réels des colonnes (Titre, Statut…) ou déjà renommées (titre, statut…).
function normalize(rec){
  const out = {id: rec.id};

    const c = map[k]; if (!c || c[0]==='@') continue;

  derive(out);
  const p = pending.get(out.id);
  if (p){ if (Date.now()-p.t < 4000){ Object.assign(out, p.changes); derive(out); } else pending.delete(out.id); }

}

/* ---- Checklist ---- */
const CL_RE = /^(\s*[-*]\s*)\[( |x|X)\]\s?(.*)$/;
function parseChecklist(text){
  const lines = String(text||'').split('\n'), items = [];
  lines.forEach((l,i)=>{ const m = l.match(CL_RE); if (m) items.push({i, done:m[2].toLowerCase()==='x', text:m[3]}); });
  return {lines, items};

function checklistCount(t){ const {items} = parseChecklist(t); return {done: items.filter(x=>x.done).length, total: items.length}; }

/* ---- Préférences propres à ce navigateur (non partagées) ---- */
function lsGet(k, d){ try { const v = localStorage.getItem('kanban.'+k); return v==null ? d : JSON.parse(v); } catch(e){ return d; } }

const norm = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const meObj = () => team.find(t=>t.id===moiId) || null;
const canSeeOthers = () => !!(meObj() && meObj().voit);   // affichage seulement : ce sont les règles d'accès qui protègent les données
function personOf(row){ const n = norm(row.email), a = norm(row.author); return team.find(t=>n && norm(t.email)===n) || team.find(t=>a && (norm(t.label)===a || norm(t.label)===norm(who(row.author)))) || null; }
function who(s){   // nom lisible : « prenom.nom », courriel ou nom → nom de la table Equipe quand on le retrouve
  s = String(s==null?'':s).trim(); if (!s) return '';
  const n = norm(s);
  const p = team.find(t=>{ const l = norm(t.label), em = norm(t.email); return l===n || l.replace(/\s+/g,'.')===n || (em && (em===n || em.split('@')[0]===n)); });
  return p ? p.label : s;
}
function resolveCols(t, pick){
  const keys = Object.keys(t).filter(k=>k!=='id' && !/^(manualSort|gristHelper_)/.test(k));
  const used = new Set(), out = {};
  for (const name in pick){ const k = keys.find(x=>!used.has(x) && pick[name].test(norm(x))); out[name] = k || null; if (k) used.add(k); }
  return out;
}
function valLabel(card, k, v){   // valeur lisible d'un champ (pour le journal)
  const x = v===undefined ? card[k] : v;
  if (k==='responsables') return refIds(x).map(id=>teamById[id]||('#'+id)).join(', ');
  if (k==='echeance'){ const d = toDate(x); return d ? d.toLocaleDateString('fr-FR') : ''; }
  return Array.isArray(x) ? toList(x).join(', ') : (x==null ? '' : String(x));
}

/* ============ MÉTADONNÉES DES COLONNES ============ */
async function loadMeta(){
  meta = {}; team = []; teamById = {}; teamCol = null; teamTable = null; metaNote = ''; moiId = null; moi = ''; idNote = '';
  try {
    const T = await grist.docApi.fetchTable('_grist_Tables');
    const C = await grist.docApi.fetchTable('_grist_Tables_column');
    const ti = T.id[T.tableId.indexOf(host)];
    const colById = {}; C.id.forEach((id,i)=>{ colById[id] = C.colId[i]; });
    const cols = {};
    C.id.forEach((id,i)=>{ if (C.parentId[i]===ti) cols[C.colId[i]] = {type:C.type[i], wo:C.widgetOptions[i], vis:C.visibleCol[i]}; });
    for (const k in map){
      const c = map[k]; if (!c || c[0]==='@' || !cols[c]) continue;
      let woObj = {}; try { woObj = JSON.parse(cols[c].wo||'{}') || {}; } catch(e){}
      const m = String(cols[c].type).match(/^Ref(?:List)?:(.+)$/);
      meta[k] = {col:c, type:String(cols[c].type), woObj, choices:(woObj.choices||[]).map(String), ref: m ? m[1] : null, visCol: cols[c].vis ? colById[cols[c].vis] : null};
    }
    if (meta.responsables && meta.responsables.ref){
      teamTable = meta.responsables.ref;
      const E = await grist.docApi.fetchTable(teamTable);
      let lab = meta.responsables.visCol;
      if (!lab || !(lab in E)) lab = ['Nom','nom','NOM','Name','name','Titre'].find(x=>x in E) || Object.keys(E).find(x=>!/^(id|manualSort|gristHelper_)/.test(x));
      teamCol = lab;
      const emCol = Object.keys(E).find(x=>/courriel|couriel|e_?mail|^mail/i.test(x));
      const mine = [];
      const meCol = Object.keys(E).find(x=>/^est_?moi$/.test(norm(x))), voitCol = Object.keys(E).find(x=>/^(manager|voit_?hors_?projet)/.test(norm(x)));
      (E.id||[]).forEach((id,i)=>{ const label = String(E[lab] ? E[lab][i] : '').trim(); if (label) { team.push({id, label, email: emCol ? String(E[emCol][i]||'').trim() : '', voit: !!(voitCol && E[voitCol][i]===true)}); teamById[id] = label;
        if (meCol && E[meCol][i]===true) mine.push({id, label}); } });   // la règle d'accès masque cette colonne sur toutes les lignes sauf la mienne
      if (mine.length===1){ moiId = mine[0].id; moi = mine[0].label; }
      if (mine.length>1) idNote = `La colonne Est_moi est lisible sur ${mine.length} lignes : sa règle ne doit comporter aucune exception, même pour les propriétaires. Les autres colonnes de « ${teamTable} » restent modifiables.`;
      else if (!meCol) idNote = `Pour reconnaître chaque personne, ajoutez à la table « ${teamTable} » la colonne formule Est_moi et sa règle d'accès (voir le guide).`;
      else if (moiId===null) idNote = `Votre compte Grist n'est pas reconnu dans la table « ${teamTable} » : vérifiez que votre courriel de connexion y figure à l'identique, ou que la règle de la colonne Est_moi est en place.`;
      team.sort((a,b)=>a.label.localeCompare(b.label,'fr'));
      metaNote = `table « ${teamTable} » (colonne « ${lab} ») : ${team.length} personne(s)`;
    }
  } catch(e){ metaNote = 'métadonnées indisponibles : '+((e&&e.message)||e); }
  metaTick++;
}

function fillBlanks(kind, t, c){   // complète auteur / courriel / date si la formule de Grist ne l'a pas fait
  const S = side[kind], me = meObj(), ups = [];
  S.fill.forEach(rid=>{
    const i = (t.id||[]).indexOf(rid); if (i<0) return; const f = {};
    if (me && c.author && !t[c.author][i]) f[c.author] = me.label;
    if (me && me.email && c.email && !t[c.email][i]) f[c.email] = me.email;
    if (c.date && (t[c.date][i]==null || t[c.date][i]==='')) f[c.date] = Math.floor(Date.now()/1000);
    if (Object.keys(f).length) ups.push(['UpdateRecord', TABLES[kind].table, rid, f]);
  });
  return ups;
}
async function loadTable(kind, again){
  const T = TABLES[kind], S = side[kind]; let sig = '';
  try {
    const t = await grist.docApi.fetchTable(T.table);
    const c = resolveCols(t, T.pick);
    if (!c.task) throw new Error('colonne « Tache » (référence vers Taches) absente');
    if (kind==='comments' && !c.text) throw new Error('colonne « Texte » absente');
    S.cols = c;
    if (S.fill.size && !again){
      const ups = fillBlanks(kind, t, c); S.fill.clear();
      if (ups.length){ await grist.docApi.applyUserActions(ups); return loadTable(kind, true); }
    }
    const cell = (col,i) => col ? t[col][i] : null;
    S.rows = (t.id||[]).map((id,i)=>({id, task: refIds(cell(c.task,i))[0]||0, parent: refIds(cell(c.parent,i))[0]||0,
      text: String(cell(c.text,i) ?? ''), event: String(cell(c.event,i) ?? ''), before: String(cell(c.before,i) ?? ''), after: String(cell(c.after,i) ?? ''),
      author: String(cell(c.author,i) ?? ''), email: String(cell(c.email,i) ?? ''), date: c.date ? toDate(cell(c.date,i)) : null}));
    S.ok = true; S.note = S.rows.length+' ligne(s)';
    sig = JSON.stringify(S.rows);
  } catch(e){ S.rows = []; S.cols = null; S.ok = false; S.note = ((e&&e.message)||String(e)); sig = 'ko:'+S.note; }
  if (sig !== S.sig){ S.sig = sig; S.tick++; render(); }
}

function commentCount(r){ return side.comments.ok ? commentsOf(r.id).length : (Number(g(r,'commentaires'))||0); }
async function addComment(taskId, parentId, text){

function notifyComment(taskId, parentId, commentId, text, mentioned){

async function deleteComment(id){

  while (grown){ grown = false; side.comments.rows.forEach(c=>{ if (c.parent && del.has(c.parent) && !del.has(c.id)){ del.add(c.id); grown = true; } }); }
  const row = side.comments.rows.find(c=>c.id===id);
  const journal = row ? histActions([{taskId:row.task, event:'Commentaire', before:(row.text||'').slice(0,120), after:'supprimé'}]) : [];

  const res = await actRes(journal.concat([...del].map(i=>['RemoveRecord', TABLES.comments.table, i])));

/* ============ ÉCRITURE DANS GRIST ============ */
// Met à jour la carte tout de suite à l'écran (optimiste), puis écrit dans Grist.
// changes : {cléWidget: valeur affichée} ; encoded : {cléWidget: valeur envoyée à Grist} (listes : ['L', ...])
async function update(card, changes, encoded, extraLog){
  const cols = {}, applied = {}, log = (extraLog||[]).map(e=>({taskId: card.id, ...e}));
  const respBefore = map.responsables ? refIds(card.responsables) : [], notes = [];
  for (const k in changes){
    if (!map[k]) continue;
    if (!HIST_KEYS[k] && !NOTIF_SKIP.includes(k) && k!=='pj' && JSON.stringify(card[k]??null)!==JSON.stringify(changes[k]??null)) notes.push(k==='titre' ? 'Titre modifié' : ((FIELDS.find(f=>f.key===k)||{label:k==='description'?'Description':k==='checklist'?'Checklist':k}).label+' modifié(e)'));
    if (HIST_KEYS[k]){ const b = valLabel(card,k), a = valLabel(card,k,changes[k]); if (b!==a) log.push({taskId: card.id, event: HIST_KEYS[k], before: b, after: a}); }
    card[k] = changes[k]; applied[k] = changes[k];
    cols[map[k]] = (encoded && k in encoded) ? encoded[k] : changes[k];
  }
  if (!Object.keys(cols).length) return false;
  const p = pending.get(card.id) || {changes:{}, t:0};
  Object.assign(p.changes, applied); p.t = Date.now(); pending.set(card.id, p);
  derive(card); render();
  const main = [['UpdateRecord', host, card.id, cols]], hist = histActions(log);
  let res;
  if (hist.length){
    res = await actRes(main.concat(hist), true);          // modification + journal dans une seule opération
    if (res){ histNote = ''; afterHistoryWrite((res.retValues||[]).slice(1)); }
    else { res = await actRes(main); if (res) histNote = "Le journal n'a pas pu être enregistré : vérifiez la table « Historique » (droits, colonnes)."; }
  } else res = await actRes(main);
  if (!res){ pending.delete(card.id); ingest(); return false; }
  notifyUpdate(card, respBefore, notes.concat(log.map(notePart)));
  verifyWrite(card.id, applied, cols);
  return true;
}
const notePart = e => e.event==='Suppression' ? 'Mise à la corbeille' : e.event==='Restauration' ? 'Restaurée depuis la corbeille' : (e.before ? `${e.event} : ${e.before} → ${e.after||'∅'}` : `${e.event} : ${e.after||'∅'}`);
function notifyUpdate(card, before, parts){
  if (!map.responsables || !parts.length) return;
  const after = refIds(card.responsables), detail = parts.join(' · ').slice(0,300), list = [];
  after.forEach(p=>list.push(before.includes(p) ? {to:p, type:'Modification', taskId:card.id, text:detail} : {to:p, type:'Assignation', taskId:card.id, text:'Responsables : '+after.map(x=>teamById[x]||('#'+x)).join(', ')}));
  before.filter(p=>!after.includes(p)).forEach(p=>list.push({to:p, type:'Modification', taskId:card.id, text:'Vous avez été retiré(e) des responsables'}));
  sendNotifs(list);
}
/* Contrôle : Grist a-t-il vraiment gardé la modification ? (une formule déclenchée ou une règle peut la remplacer) */
const VERIFY_KEYS = ['responsables','votants','statut','prio','charge'];
const verifyTok = {};
async function verifyWrite(id, applied, cols){
  const ks = VERIFY_KEYS.filter(k=>k in applied && map[k]); if (!ks.length || !host) return;
  const tok = verifyTok[id] = (verifyTok[id]||0) + 1;
  await new Promise(r=>setTimeout(r, 1800));
  if (verifyTok[id]!==tok) return;                       // une modification plus récente est en cours : on ne compare pas
  try {
    const t = await grist.docApi.fetchTable(host), i = (t.id||[]).indexOf(id);
    if (i<0 || verifyTok[id]!==tok) return;
    const flat = v => (Array.isArray(v) ? (v[0]==='L' ? v.slice(1) : v) : [v]).filter(x=>x!=null && x!=='' && x!==0).map(String).sort().join('|');
    for (const k of ks){
      const col = map[k]; if (!(col in t)) continue;
      if (flat(t[col][i]) !== flat(cols[col])){
        const lab = (FIELDS.find(f=>f.key===k)||{label:k}).label;
        const shown = k==='responsables' || k==='votants' ? refIds(t[col][i]).map(x=>teamById[x]||('#'+x)).join(', ') : valLabel({}, k, t[col][i]);
        flash("Grist n'a pas conservé votre modification (« "+lab+" »). Valeur actuelle dans la table : « "+(shown||'vide')+" ». Une formule déclenchée sur cette colonne, une règle d'accès ou un type de colonne différent la remplace probablement.");
        return;
      }
    }
  } catch(e){}
}
async function actRes(actions, quiet){
  if (!host){ if (!quiet) flash("Table du widget introuvable : rechargez la page."); return null; }
  try { return (await grist.docApi.applyUserActions(actions)) || {retValues:[]}; }
  catch(e){ if (!quiet) flash('Action refusée ou impossible : ' + ((e && e.message) || e)); return null; }
}
async function act(actions){ return !!(await actRes(actions)); }

/* ============ VALEURS D'UN CHAMP (carte, fiche, filtres) ============ */
const fieldOn = f => map && (f.key==='responsables' ? (map.responsables || map.personnes) : map[f.key]);
function optionsFor(key){   // [{v, label}]
  if (key==='responsables') return team.map(t=>({v:t.id, label:t.label}));
  const f = FIELDS.find(x=>x.key===key);
  return choicesFor(key, (f && f.fallback) || []).map(v=>({v, label:v}));
}
function isMulti(key){ return key==='responsables' ? isListRef() : (FIELDS.find(x=>x.key===key).kind==='tags' && isListCol(key)); }
function selectedOf(card, key){   // valeurs sélectionnées (ids pour les personnes)
  if (key==='responsables') return refIds(card.responsables);
  return L(card, key);
}
const amResp = c => { const m = meObj(); return !!(m && refIds(c.responsables).includes(m.id)); };
function askConfirm(msg, okLabel){   // confirmation dans la page : les fenêtres du navigateur bloqueraient le widget
  return new Promise(res=>{
    const p = $('pop'); p.style.display = 'block';
    p.innerHTML = `<b>Confirmer</b><div style="margin:8px 0;line-height:1.4">${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button id="cf-no">Annuler</button><button class="primary" id="cf-ok">${esc(okLabel)}</button></div>`;
    const end = v=>{ closePop(); res(v); };
    $('cf-ok').onclick = ()=>end(true); $('cf-no').onclick = ()=>end(false);
  });
}
const refuse = msg => { flash(msg); renderMenu(); return false; };
async function setEspace(card, v){
  const toHP = norm(v)===norm(ESP_HP), hasResp = map.responsables && refIds(card.responsables).length>0;
  const changes = {espace:v}, encoded = {};
  if (toHP){
    if (hasResp && !amResp(card)){
      if (!canSeeOthers()) return refuse("Seules les personnes responsables de la tâche ou le manager peuvent la passer en hors projet.");
      if (!await askConfirm(`« ${card.titre||'Cette tâche'} » ne sera plus visible que par ses responsables et le manager.`, 'Passer en hors projet')) return false;
    }
    if (map.responsables && !hasResp){   // sans responsable, elle ne serait visible de personne : elle revient à son créateur, à défaut à la personne qui la déplace
      const n = who(g(card,'creePar')), pp = team.find(t=>t.label===n) || meObj();
      if (pp){ const list = isListRef(); changes.responsables = list ? [pp.id] : pp.id; encoded.responsables = list ? ['L',pp.id] : pp.id; }
    }
    if (map.statut && !g(card,'statut')) changes.statut = STATUT_DEFAUT;
  } else if (isHP(card)){
    if (!await askConfirm(`« ${card.titre||'Cette tâche'} », ses commentaires et son historique seront visibles par toute l'équipe.`, 'Passer en projet')) return false;
    const pr = g(card,'prio')||'';
    if (!(PRIO_GROOMEE.test(pr) || pr===PRIO_RELEGUE)){   // pas assez qualifiée pour le Suivi : retour au Backlog
      if (map.statut) changes.statut = null;
      if (map.prio && !pr) changes.prio = PRIO_NOUVEAU;
    }
  }
  return update(index.get(card.id)||card, changes, encoded);
}
async function setField(card, key, v){   // choisit (ou décoche) une valeur
  if (key==='responsables'){
    const list = isListRef(), cur = refIds(card.responsables), has = cur.includes(v);
    const ids = list ? (has ? cur.filter(x=>x!==v) : [...cur, v]) : (has ? [] : [v]);
    if (isHP(card)){
      if (!ids.length) return refuse('Une tâche hors projet doit garder au moins un responsable.');
      if (!canSeeOthers()){
        const m = meObj();
        if (!amResp(card)) return refuse('Seuls ses responsables et le manager peuvent modifier les responsables de cette tâche.');
        if ((has && m && v===m.id) || (!list && !has)) return refuse('Seul le manager peut confier une tâche hors projet. Vous pouvez la partager en ajoutant un co-responsable.');
        if (!has && !await askConfirm(`${teamById[v]||'Cette personne'} deviendra co-responsable de « ${card.titre||'cette tâche'} » et pourra la voir.`, 'Partager')){ renderMenu(); return false; }
      }
    }
    return update(card, {responsables: list ? ids : (ids[0]||0)}, {responsables: list ? ['L',...ids] : (ids[0]||0)});
  }
  const cur = L(card,key), has = cur.includes(v);
  if (key==='statut' && has) return;
  if (key==='espace' && !has) return setEspace(card, v);
  if (isMulti(key)){ const next = has ? cur.filter(x=>x!==v) : [...cur, v]; return update(card, {[key]: next}, {[key]: ['L',...next]}); }
  return update(card, {[key]: has ? null : v});
}
function removeValue(card, key, v){ if (key==='responsables') return setField(card,key,+v); return setField(card,key,String(v)); }

/* --- votes : un vote par personne si la colonne Votants est associée --- */
const voteCount = r => map.votants ? refIds(r.votants).length : (Number(g(r,'votes'))||0);
const hasVoted = r => { const m = meObj(); return !!(map.votants && m && refIds(r.votants).includes(m.id)); };
async function castVote(card){
  if (!card) return;
  if (map.votants){
    const m = meObj();
    if (!m){ flash(idNote || 'Votre compte Grist n\'est pas reconnu.'); return; }
    const c = index.get(card.id) || card;
    const cur = refIds(c.votants), ids = cur.includes(m.id) ? cur.filter(x=>x!==m.id) : [...cur, m.id];
    return update(c, {votants: ids}, {votants: ['L', ...ids]});
  }
  return update(card, {votes: (Number(g(card,'votes'))||0)+1});
}

/* --- règles du Backlog --- */
const canEnterSuivi = r => !g(r,'statut') && (PRIO_GROOMEE.test(g(r,'prio')||'') || g(r,'prio')===PRIO_RELEGUE);   // seulement depuis P0–P3 ou Relégué
function backlogPrioFor(r){   // colonne du Backlog où part une carte renvoyée du Suivi
  const p = g(r,'prio') || '';
  if (PRIO_GROOMEE.test(p)) return PRIO_RELEGUE;   // déjà travaillée → Relégué
  if (!p) return PRIO_NOUVEAU;                      // jamais priorisée → Nouveau
  return p;                                         // Nouveau, Relégué, Abandonné, Déjà prévu : inchangé
}
async function sendBack(card){
  if (!card || !map.prio || !g(card,'statut')) return false;
  const target = backlogPrioFor(card);
  if (target===PRIO_RELEGUE && meta.prio && !meta.prio.choices.includes(PRIO_RELEGUE)) await addChoice('prio', PRIO_RELEGUE);   // crée le choix « Relégué » au besoin
  const c = index.get(card.id) || card;
  return update(c, {statut:null, prio:target});
}
async function trashTask(card){   // suppression douce : la ligne reste dans la table
  if (!card || !map.supprimee) return false;
  openId = null; ficheSig = ''; delConfirm = null; closeMenu();
  return update(card, {supprimee:true}, undefined, [{event:'Suppression', before:'', after:card.titre||''}]);
}
async function restoreTask(card){
  if (!card || !map.supprimee) return false;
  openId = null; ficheSig = ''; delConfirm = null; closeMenu();
  return update(card, {supprimee:false}, undefined, [{event:'Restauration', before:'', after:card.titre||''}]);
}
async function deleteTask(card){
  if (!card) return false;
  const id = card.id, title = card.titre || '';
  const cs = side.comments.ok ? side.comments.rows.filter(c=>c.task===id).map(c=>c.id) : [];
  const hp = isHP(card), resp = map.responsables ? refIds(card.responsables) : [];
  // Hors projet : aucune trace du titre et plus d'historique. Une ligne de journal sans tâche échapperait à la règle d'accès.
  const hist = hp ? [] : histActions([{taskId:id, event:'Suppression définitive', before:title, after:''}]);
  const hs = (hp && side.history.ok) ? historyOf(id).map(h=>h.id) : [];
  const rm = [...(cs.length ? [['BulkRemoveRecord', TABLES.comments.table, cs]] : []), ...(hs.length ? [['BulkRemoveRecord', TABLES.history.table, hs]] : []), ['RemoveRecord', host, id]];
  let res = hist.length ? await actRes(hist.concat(rm), true) : null;
  if (res){ histNote = ''; afterHistoryWrite([(res.retValues||[])[0]]); }
  else { res = await actRes(rm); if (res && hist.length) histNote = "Le journal n'a pas pu être enregistré : vérifiez la table « Historique » (droits, colonnes)."; }
  if (!res) return false;
  sendNotifs(resp.map(p=>({to:p, type:'Modification', taskId:0, text:`« ${title} » a été supprimée définitivement`})));
  pending.delete(id); rawRecs = rawRecs.filter(r=>r.id!==id); delConfirm = null; openId = null; ficheSig = ''; closeMenu();
  ingest();
  loadTable('comments');
  return true;
}
async function afterHistoryWrite(ids){   // complète la date tout de suite, puis la signature une fois l'identité connue
  ids = ids.filter(i=>typeof i==='number'); if (!ids.length) return;
  ids.forEach(i=>side.history.fill.add(i)); await loadTable('history');
}

/* --- création de nouvelles valeurs --- */
async function widgetOptsWrite(key, mutate){
  const m = meta[key]; if (!m) throw new Error('colonne introuvable (métadonnées non chargées)');
  const wo = JSON.parse(JSON.stringify(m.woObj||{})); wo.choices = [...(wo.choices||m.choices||[])];
  mutate(wo);
  await grist.docApi.applyUserActions([['ModifyColumn', host, m.col, {widgetOptions: JSON.stringify(wo)}]]);
}
async function addChoice(key, v){
  if (!meta[key] || meta[key].choices.includes(v)) return;
  try { await widgetOptsWrite(key, wo=>wo.choices.push(v)); await reloadMeta(); } catch(e){ /* sans droit sur la structure : la valeur est quand même utilisable */ }
}
async function createPerson(name){
  if (!teamTable || !teamCol) throw new Error('table des responsables introuvable');
  const res = await grist.docApi.applyUserActions([['AddRecord', teamTable, null, {[teamCol]: name}]]);
  const id = res && res.retValues && res.retValues[0];
  await reloadMeta(); return id;
}
async function createAndSet(card, key, name){
  name = String(name||'').trim(); if (!name) return;
  if (key==='responsables'){
    try { const id = await createPerson(name); if (typeof id==='number' && !refIds(card.responsables).includes(id)) await setField(card,key,id); }
    catch(e){ flash('Création impossible : '+((e&&e.message)||e)); }
    return;
  }
  await addChoice(key, name);
  if (!L(card,key).includes(name)) await setField(card,key,name);
}

/* ============ MENUS DÉROULANTS ============ */
function openMenu(anchor, build){ if (menu && menu.anchor===anchor){ closeMenu(); return; } menu = {anchor, build}; renderMenu(); }
function closeMenu(){ menu = null; $('menu').style.display='none'; }
function renderMenu(){
  const el = $('menu');
  if (!menu){ el.style.display='none'; return; }
  const a = document.querySelector(`[data-anchor="${menu.anchor}"]`);
  if (!a){ closeMenu(); return; }
  const ae = document.activeElement;
  if (el.contains(ae) && ae.tagName==='INPUT' && ['text','date','search'].includes(ae.type) && ae.value) return;          // on ne casse pas une saisie en cours
  const b = menu.build();
  el.innerHTML = b.html; el.style.display = 'block';
  const r = a.getBoundingClientRect();
  el.style.maxHeight = 'none';
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(6, Math.min(r.left, window.innerWidth - w - 8))+'px';
  const below = window.innerHeight - r.bottom - 12, above = r.top - 12;   // le menu défile dans la place disponible, sans déborder du widget
  if (h <= below){ el.style.maxHeight = ''; el.style.top = (r.bottom+4)+'px'; }
  else if (above > below){ const mh = Math.min(h, above); el.style.maxHeight = mh+'px'; el.style.top = Math.max(6, r.top-mh-4)+'px'; }
  else { el.style.maxHeight = Math.max(120, below)+'px'; el.style.top = (r.bottom+4)+'px'; }
  b.bind(el);
}

function openManage(key){ manage = {key: key==='personnes' ? 'responsables' : key, confirm:null, msg:''}; closeMenu(); renderManage(); }

async function runManage(fn){

async function mgAdd(key, v){
  if (key==='responsables') return createPerson(v);
  if (meta[key] && meta[key].choices.includes(v)) throw new Error('cette valeur existe déjà');
  await widgetOptsWrite(key, wo=>wo.choices.push(v));
}
/* Part de la table entière, pas des lignes reçues par le widget : un filtre de section ne doit pas laisser de cartes non mises à jour.
   fn(enregistrement) -> nouvelle valeur envoyée à Grist, ou undefined si inchangé. */
async function rowsAction(key, fn){
  const col = map[key], t = await grist.docApi.fetchTable(host), ids = [], vals = [];
  (t.id||[]).forEach((id,i)=>{ const nv = fn({id, [key]: t[col] ? t[col][i] : null}); if (nv !== undefined){ ids.push(id); vals.push(nv); } });
  return ids.length ? [['BulkUpdateRecord', host, ids, {[col]: vals}]] : [];
}
function optsAction(key, mutate){
  const m = meta[key]; if (!m) throw new Error('colonne introuvable (métadonnées non chargées)');
  const wo = JSON.parse(JSON.stringify(m.woObj||{})); wo.choices = [...(wo.choices||m.choices||[])];
  mutate(wo);
  return ['ModifyColumn', host, m.col, {widgetOptions: JSON.stringify(wo)}];
}
async function mgRename(key, oldV, newV){
  if (key==='responsables'){ await grist.docApi.applyUserActions([['UpdateRecord', teamTable, oldV, {[teamCol]: newV}]]); return; }
  if (meta[key] && meta[key].choices.includes(newV)) throw new Error('cette valeur existe déjà');
  const list = isListCol(key);
  const rows = await rowsAction(key, r=>{
    const cur = L(r,key); if (!cur.includes(oldV)) return undefined;
    const next = [...new Set(cur.map(x=>x===oldV?newV:x))];
    return list ? ['L',...next] : newV;
  });
  await grist.docApi.applyUserActions([optsAction(key, wo=>{
    wo.choices = wo.choices.map(c=>c===oldV?newV:c);
    if (wo.choiceOptions && oldV in wo.choiceOptions){ wo.choiceOptions[newV] = wo.choiceOptions[oldV]; delete wo.choiceOptions[oldV]; }
  }), ...rows]);   // une seule opération : tout passe, ou rien
  // les couleurs et l'ordre mémorisés suivent la valeur renommée
  let changed = false;
  if (colors.tags[oldV]){ colors.tags[newV]=colors.tags[oldV]; delete colors.tags[oldV]; changed = true; }
  if (colors.groups[oldV]){ colors.groups[newV]=colors.groups[oldV]; delete colors.groups[oldV]; changed = true; }
  if (changed) saveColors();
  for (const m in colOrder){ if ((colOrder[m]||[]).includes(oldV)){ colOrder[m] = colOrder[m].map(x=>x===oldV?newV:x); grist.setOption('order', colOrder); } }
}
async function mgDelete(key, v){
  if (key==='responsables'){
    const list = isListRef();
    const rows = await rowsAction('responsables', r=>{ const cur = refIds(r.responsables); if (!cur.includes(v)) return undefined; const next = cur.filter(x=>x!==v); return list ? ['L',...next] : 0; });
    await grist.docApi.applyUserActions([...rows, ['RemoveRecord', teamTable, v]]); return;
  }
  const list = isListCol(key);
  const rows = await rowsAction(key, r=>{ const cur = L(r,key); if (!cur.includes(v)) return undefined; const next = cur.filter(x=>x!==v); return list ? ['L',...next] : null; });
  await grist.docApi.applyUserActions([optsAction(key, wo=>{ wo.choices = wo.choices.filter(c=>c!==v); if (wo.choiceOptions) delete wo.choiceOptions[v]; }), ...rows]);
}

/* ============ COLONNES DU KANBAN (selon la vue) ============ */
// Vue Backlog : colonnes = Prio. Vues Suivi et Mes tâches : colonnes = Statut.
const groupChoices = () => (mode==='corbeille' ? [] : mode==='backlog' ? ['prio','charge'] : ['statut','prio','charge']).filter(k=>map && map[k]);
const defaultGroup = () => mode==='backlog' ? 'prio' : 'statut';
const groupKey = () => { const k = grpBy[mode] || defaultGroup(); return (k===defaultGroup() || groupChoices().includes(k)) ? k : defaultGroup(); };
const orderKey = () => groupKey()===defaultGroup() ? mode : mode+':'+groupKey();   // ordre des colonnes mémorisé par vue et par regroupement
const groupOf = r => mode==='corbeille' ? '' : groupKey()==='prio' ? String(prioEff(r)) : (groupKey()==='statut' && isHP(r) && !g(r,'statut')) ? STATUT_DEFAUT : String(g(r, groupKey()) || '');
function groupList(){
  if (mode==='corbeille') return [{name:'', label:'Corbeille', color:'#8a8f98'}];
  const k = groupKey(), fld = FIELDS.find(f=>f.key===k);
  const defaults = k==='prio' ? PRIO_COLORS : k==='charge' ? CHARGE_COLORS : STATUT_COLORS;
  const hasDecl = !!(meta[k] && meta[k].choices && meta[k].choices.length);
  const declared = hasDecl ? meta[k].choices : fld.fallback;
  const all = choicesFor(k, fld.fallback).sort((a,b)=>{ const ia=declared.indexOf(a), ib=declared.indexOf(b); return (ia<0?999:ia)-(ib<0?999:ib); });
  if (k==='prio' && mode==='backlog' && !all.includes(PRIO_NOUVEAU)) all.push(PRIO_NOUVEAU);   // les tâches sans prio y sont affichées
  const ord = colOrder[orderKey()] || [];
  const rank = n => { const i = ord.indexOf(n); return i>=0 ? i : 1000 + all.indexOf(n); };
  const list = all.map((n,i)=>({name:n, color:colors.groups[n]||defaults[i]||'#999', warn: hasDecl && !declared.includes(n)})).sort((a,b)=>rank(a.name)-rank(b.name));
  if (mode==='perso' && k==='statut') list.unshift({name:'', label:'À qualifier', color:'#6b7280'});
  else if (records.some(r=>inView(r) && !groupOf(r))) list.push({name:'', label: k==='prio'?'Sans priorité':k==='charge'?'Sans charge':'Sans statut', color:'#bbb'});
  return list;
}
function moveColumn(from, to){
  if (!from || !to || from===to) return;
  const before = groupList().map(x=>x.name).filter(Boolean);
  const names = before.slice(); const fi = names.indexOf(from); if (fi<0) return;
  names.splice(fi,1); const ti = names.indexOf(to);
  names.splice(fi < before.indexOf(to) ? ti+1 : ti, 0, from);
  colOrder[orderKey()] = names; grist.setOption('order', colOrder); render();
}

/* ============ TRI DES CARTES (dans chaque colonne) ============ */
const SORTS = [['prio','Prio'],['echeance','Échéance'],['charge','Charge']];
function sortCards(list){
  const crit = sortPref.filter(s=>s && s.k && map[s.k]);
  const rankOf = (r,k)=>{
    if (k==='echeance'){ const d = toDate(g(r,'echeance')); return d ? +d : null; }
    const v = k==='prio' ? prioEff(r) : g(r,k); if (!v) return null;
    const dec = (meta[k] && meta[k].choices && meta[k].choices.length) ? meta[k].choices : FIELDS.find(f=>f.key===k).fallback;
    const i = dec.indexOf(String(v)); return i<0 ? 999 : i;
  };
  return list.slice().sort((a,b)=>{
    for (const s of crit){
      const x = rankOf(a,s.k), y = rankOf(b,s.k);
      if (x===y) continue; if (x==null) return 1; if (y==null) return -1;
      return s.d==='desc' ? y-x : x-y;
    }
    const da = toDate(g(a,'echeance')), db = toDate(g(b,'echeance'));
    return ((da?+da:9e15)-(db?+db:9e15)) || (a.id-b.id);
  });
}

/* ============ FILTRAGE ============ */
// Règle Backlog / Suivi : un Statut renseigné = Suivi ; pas de Statut = Backlog
function inView(r){
  if (mode==='corbeille') return isDel(r);
  if (isDel(r)) return false;
  const hasStatut = !!g(r,'statut');
  if (mode==='perso') return isHP(r) || hasStatut || persoFor!=='*';   // Mes tâches : Suivi, hors projet et tâches à qualifier d'une personne
  if (isHP(r)) return false;                                   // Suivi et Backlog : uniquement le projet
  return mode==='backlog' ? !hasStatut : hasStatut;
}
function passes(r){
  if (!inView(r)) return false;
  if (mode==='perso'){
    const target = canSeeOthers() && persoFor ? persoFor : moi;
    if (!(canSeeOthers() && persoFor==='*') && !(target && L(r,'personnes').includes(target))) return false;
  }
  for (const f of FILTERS){
    if (f.skipIn===mode) continue;
    const sel = F[f.id]; if (!sel.length) continue;
    const vals = f.key==='prio' ? (prioEff(r) ? [String(prioEff(r))] : []) : L(r, f.key);
    if (!sel.some(x=>vals.includes(x))) return false;
  }
  if (F.from||F.to){
    const d = toDate(g(r,'echeance')); if (!d) return false;
    if (F.from && dayStart(d) < dayStart(F.from)) return false;
    if (F.to && dayStart(d) > dayStart(F.to)) return false;
  }
  if (F.q){
    const hay = [r.titre,g(r,'description'),...L(r,'personas'),...L(r,'themes'),...L(r,'sources'),...L(r,'produit'),...L(r,'etiquettes'),...L(r,'personnes'),g(r,'checklist')].join(' ').toLowerCase();
    if (!hay.includes(F.q.toLowerCase())) return false;
  }
  return true;
}

    if (F.from || F.to) chips += `<span class="fchip">Échéance${F.from?' du '+esc(new Date(F.from).toLocaleDateString('fr-FR')):''}${F.to?' au '+esc(new Date(F.to).toLocaleDateString('fr-FR')):''}<button data-chd="1" aria-label="Retirer ce filtre">×</button></span>`;

function renderWarn(){
  const parts = [];
  if (map && idNote) parts.push(`<div class="warn"><b>⚠</b> ${esc(idNote)}</div>`);
  if (map && !map.espace) parts.push(`<div class="warn"><b>⚠</b> Associez la colonne <b>Espace</b> dans la configuration du widget : sans elle, les tâches hors projet apparaissent dans le Suivi et le Backlog.</div>`);
  if (map){
    const total = records.length, shown = records.filter(passes).length, inv = records.filter(inView).length;
    if (mode==='corbeille') parts.push(`<div class="info">Corbeille : ces tâches restent dans la table (colonne « Supprimée » cochée). Restaurez une tâche pour la remettre dans le Kanban.</div>`);
    if ((!total || !shown) && !(mode==='corbeille' && total)){
      let t = `${total} ligne(s) reçue(s) de « ${esc(host||'?')} » · ${shown} affichée(s) dans cette vue`;
      if (inv<total) t += ` · ${total-inv} dans une autre vue`;
      if (inv>shown) t += ` · ${inv-shown} masquée(s) par les filtres`;
      if (!total) t += ` — <b>Grist n'envoie aucune ligne</b> : vérifiez qu'aucun filtre n'est actif sur le widget (bouton « Enregistrer » / ↺ en haut à droite de la section).`;
      else t += ` (le Backlog affiche les cartes sans Statut, le Suivi celles qui ont un Statut).`;
      parts.push(`<div class="info">${t} <span style="opacity:.6">(widget v${VERSION})</span></div>`);
    }
  }
  if (map && map.responsables){
    const filled = v => Array.isArray(v) ? v.some(x=>x!=null && x!=='' && x!=='L' && x!==0) : (v!=null && v!=='' && v!==0);
    const bad = records.filter(r=>!isDel(r) && filled(r.responsables) && !refIds(r.responsables).length);
    if (bad.length) parts.push(`<div class="warn"><b>⚠</b> ${bad.length} tâche(s) ont un responsable que le widget ne sait pas lire (exemple : « ${esc(JSON.stringify(bad[0].responsables)).slice(0,80)} »). Vérifiez que la personne existe dans la table Equipe et envoyez-moi cet exemple.</div>`);
  }
  if (histNote) parts.push(`<div class="warn">${esc(histNote)}</div>`);
  if (flashNote) parts.push(`<div class="warn" id="flash"><b>⚠</b> ${esc(flashNote)} <span class="lnk" id="flash-x" style="display:inline;cursor:pointer">Fermer</span></div>`);
  $('warn').innerHTML = parts.join('');
  const fx = $('flash-x'); if (fx) fx.onclick = ()=>{ flashNote = ''; renderWarn(); };
}

function showError(e){
  const el = $('err'); if (!el) return;
  const msg = (e && (e.stack || e.message)) || String(e);
  el.innerHTML = `<div class="err"><b>Erreur dans le widget</b> (copiez ce texte et envoyez-le) :<br><code>${esc(msg).slice(0,700)}</code></div>`;
}

window.addEventListener('unhandledrejection', e=>showError(e.reason));

/* ============ RENDU : cartes et colonnes ============ */
function dateBadge(r){
  const d = toDate(g(r,'echeance')); if(!d) return '';
  const statut = g(r,'statut') || '';
  let cls = 'd-grey';
  if (STATUT_TERMINE.includes(statut)) cls = 'd-ok';
  else {
    const diff = Math.round((dayStart(d)-dayStart(new Date()))/86400000);
    if (diff <= thr.red) cls = 'd-red'; else if (diff <= thr.orange) cls = 'd-orange';
  }
  return `<span class="date ${cls}">${fmtDate(d)}${cls==='d-ok'?' ✔':''}</span>`;
}
function cardHtml(r){
  let tags = '';
  if (isHP(r)) tags += `<button class="hpill" data-cesp="1" data-anchor="ce-${r.id}" title="Changer l'espace">${esc(ESP_HP)} ▾</button>`;
  if (mode==='perso' && !isHP(r) && !g(r,'statut') && g(r,'prio')===PRIO_RELEGUE) tags += '<span class="tag" style="background:#e6e8ec;color:#444">Retour du Suivi</span>';
  if (mode!=='backlog' && g(r,'prio')) tags += tagX(g(r,'prio'),'prio');
  if (g(r,'charge')) tags += tagX(g(r,'charge'),'charge');
  ['etiquettes','personas','produit','themes','sources'].forEach(k=>L(r,k).forEach(t=>tags+=tagX(t,k)));
  if (mode!=='corbeille') tags += `<button class="cplus" data-cplus="1" data-anchor="cp-${r.id}" title="Modifier le statut, la prio, la charge, le responsable ou l'espace">＋</button>`;
  let m = dateBadge(r);
  const cl = checklistCount(g(r,'checklist'));
  if (cl.total) m += `<span>☑ ${cl.done}/${cl.total}</span>`;
  const pj = refIds(g(r,'pj')).length; if (pj) m += `<span>📎${pj}</span>`;
  const cc = commentCount(r); if (cc) m += `<span>🗨️${cc}</span>`;
  if (mode==='corbeille' && !isHP(r) && (map.votes||map.votants) && voteCount(r)) m += `<span title="Votes">👍 ${voteCount(r)}</span>`;
  if ((mode==='backlog' || mode==='suivi') && (map.votes||map.votants)) m += `<button class="vote ${hasVoted(r)?'on':''}" data-vote="1" title="${map.votants?(hasVoted(r)?'Retirer mon vote':'Voter (un vote par personne)'):'Voter'}">👍 ${voteCount(r)}</button>`;
  if (mode==='backlog' && canEnterSuivi(r)) m += `<button class="tosuivi" data-tosuivi="1" title="Envoyer dans le Suivi, colonne « ${STATUT_DEFAUT} »">➜ Suivi</button>`;
  if (mode==='corbeille') m += `<button class="tosuivi" data-restore="1" title="Remettre la tâche dans le Kanban">↩ Restaurer</button>`;
  const names = L(r,'personnes');
  const av = names.map(n=>`<span class="av" title="${esc(n)}">${esc(initials(n))}</span>`).join('') || (map.responsables && mode!=='corbeille' ? '<span class="av none">+</span>' : '');
  return `<div class="card${r.id===openId?' open':''}" draggable="${mode==='corbeille'?'false':'true'}" data-id="${r.id}">
    <div class="tags">${tags}</div>
    <div class="title">${esc(r.titre)||'<i>(sans titre)</i>'}</div>
    <div class="meta">${m}${map.responsables && mode!=='corbeille' ? `<button class="avatars" data-cresp="1" data-anchor="ca-${r.id}" aria-label="${names.length?'Responsables : '+esc(names.join(', '))+'. Modifier':'Ajouter un responsable'}" title="${names.length?'Modifier les responsables':'Ajouter un responsable'}">${av}</button>` : `<div class="avatars">${av}</div>`}</div></div>`;
}
function renderBoard(){
  const board = $('board');
  if (!map){ board.innerHTML = '<div class="msg">Associez au minimum les colonnes <b>Titre</b>, <b>Statut</b> et <b>Priorité</b> dans la configuration du widget.</div>'; return; }
  const left = board.scrollLeft, top = board.scrollTop;
  const shown = records.filter(passes);
  board.innerHTML = groupList().map(gr=>{
    const cards = sortCards(shown.filter(r=>groupOf(r)===gr.name));
    return `<div class="col" data-group="${esc(gr.name)}">
      <h2 ${gr.name?'draggable="true"':''} data-colh="${esc(gr.name)}" title="Glisser pour déplacer la colonne"><span class="grip">⋮⋮</span><span class="dot" style="background:${gr.color}"></span>${esc(gr.label||gr.name)}${gr.warn?'<span class="warnc" title="Valeur absente des choix de la colonne Grist : saisie par erreur ? Corrigez-la dans la table.">⚠</span>':''}<span class="count">${cards.length}</span></h2>
      ${cards.map(cardHtml).join('')}
      ${gr.name?`<button class="add" data-add="${esc(gr.name)}">+ Nouvelle carte</button>`:''}</div>`;
  }).join('');
  board.scrollLeft = left; board.scrollTop = top;
  wire();
}
function render(){
  try { rebuild(); renderHeader(); renderWarn(); renderBoard(); renderPanel(); renderFiche(); renderManage(); renderMenu(); renderDiag(); renderNotifs(); $('err').innerHTML=''; }
  catch(e){ showError(e); }
}
function rebuild(){ if (map && mode==='corbeille' && !map.supprimee) mode = 'suivi'; index = new Map(records.map(r=>[r.id,r])); }

function closePop(){ $('pop').style.display='none'; }
function openNewPop(group){
  const p = $('pop'); p.style.display='block';
  p.innerHTML = `<b>Nouvelle carte</b> <span class="hint">(${esc(group)})</span>
    <div class="row"><input id="nt" placeholder="Titre de la tâche…" autocomplete="off"></div>
    <div class="row" style="justify-content:flex-end"><button id="ncancel">Annuler</button><button class="primary" id="nok">Créer</button></div>`;
  const perso = mode==='perso';
  const forOther = perso && canSeeOthers() && persoFor && persoFor!=='*' ? team.find(t=>t.label===persoFor) : null;
  if (perso) p.querySelector('.hint').textContent = '('+group+' · hors projet, au nom de '+(forOther ? forOther.label : 'vous')+')';
  const ok = async ()=>{
    const t = $('nt').value.trim();
    if (!t) return; closePop();
    const gk = groupKey();
    let me = null;
    if (perso){
      me = forOther || meObj();
      if (!me || !map.responsables || !map.espace){ flash(idNote || 'Création impossible : associez les colonnes Responsables et Espace.'); return; }
    }
    const f = {[map.titre]: t, [map[gk]]: group};                       // la colonne cliquée donne la valeur (Statut, Prio ou Charge)
    if (mode!=='backlog' && gk!=='statut' && map.statut) f[map.statut] = STATUT_DEFAUT;   // sinon la carte partirait au Backlog
    if (mode==='backlog' && gk!=='prio' && map.prio) f[map.prio] = PRIO_NOUVEAU;

    if (perso) f[map.responsables] = isListRef() ? ['L', me.id] : me.id;
    const res = await actRes([['AddRecord', host, null, f]]);

    if (typeof id==='number'){

  $('nt').onkeydown = e=>{ if(e.key==='Enter') ok(); if(e.key==='Escape') closePop(); };

/* ============ PIÈCES JOINTES ============ */
async function uploadFiles(cardId, files){
  files = [...(files||[])]; if (!files.length || uploadNote) return;
  uploadNote = files.length>1 ? `Envoi de ${files.length} fichiers…` : `Envoi de « ${files[0].name} »…`; refreshFiche();
  try {
    const tok = await grist.docApi.getAccessToken({readOnly:false});   // jeton court demandé à Grist : jamais affiché ni conservé
    const form = new FormData();
    files.forEach(x=>form.append('upload', x, x.name));
    const resp = await fetch(`${tok.baseUrl}/attachments?auth=${encodeURIComponent(tok.token)}`, {method:'POST', body:form, headers:{'X-Requested-With':'XMLHttpRequest'}});
    if (!resp.ok){ const d = (await resp.text()).slice(0,200); throw new Error(resp.status===413 ? 'fichier trop volumineux pour ce serveur' : `réponse ${resp.status} du serveur ${d}`); }
    const newIds = await resp.json();
    const t = await grist.docApi.fetchTable(host), i = (t.id||[]).indexOf(cardId);   // relu dans Grist : un collègue a pu ajouter un fichier entre-temps
    if (i<0) throw new Error('tâche introuvable');
    const c = index.get(cardId), next = [...refIds(t[map.pj][i]), ...newIds];
    uploadNote = '';
    if (c) await update(c, {pj:next}, {pj:['L',...next]}, [{event:'Pièce jointe', before:'', after:files.map(x=>x.name).join(', ')}]);
    await loadAttachMeta();
  } catch(e){ uploadNote = ''; flash("Envoi impossible : "+((e&&e.message)||e)); refreshFiche(); }
}

async function downloadAttachment(id){
  try {
    const tok = await grist.docApi.getAccessToken({readOnly:true});
    const a = document.createElement('a');
    a.href = `${tok.baseUrl}/attachments/${id}/download?auth=${encodeURIComponent(tok.token)}`; a.target='_blank'; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
  } catch(e){ flash("Ouverture impossible : "+((e&&e.message)||e)); }
}

/* ============ NOTIFICATIONS ============ */
async function loadNotifs(){
  const T = TABLES.notifs, S = side.notifs; let sig = '';
  try {
    const t = await grist.docApi.fetchTable(T.table), c = resolveCols(t, T.pick);
    if (!c.recipient || !c.type) throw new Error('colonnes « Destinataire » et « Type » requises');
    const cell = (col,i) => col ? t[col][i] : null;
    S.cols = c;
    S.rows = (t.id||[]).map((id,i)=>({id, recipient: refIds(cell(c.recipient,i))[0]||0, type: String(cell(c.type,i) ?? ''), task: refIds(cell(c.task,i))[0]||0, comment: refIds(cell(c.comment,i))[0]||0,
      author: String(cell(c.author,i) ?? ''), text: String(cell(c.text,i) ?? ''), date: c.date ? toDate(cell(c.date,i)) : null, read: !!cell(c.read,i)}));
    S.ok = true; S.note = S.rows.length+' ligne(s) visible(s)'; sig = JSON.stringify(S.rows);
  } catch(e){ S.rows = []; S.cols = null; S.ok = false; S.note = (e&&e.message)||String(e); sig = 'ko:'+S.note; }
  if (sig !== S.sig){ S.sig = sig; S.tick++; renderNotifs(); }
}
// Écrites à part de la modification : un refus sur Notifications ne doit jamais annuler le travail de l'utilisateur.
async function sendNotifs(list){
  const c = side.notifs.cols, me = meObj(), seen = new Set(); if (!c || !list.length) return;
  const now = Math.floor(Date.now()/1000);
  const acts = list.filter(n=>{ const k = n.to+'|'+n.type+'|'+n.taskId; if (!n.to || (me && n.to===me.id) || seen.has(k)) return false; seen.add(k); return true; }).map(n=>{
    const f = {[c.recipient]: n.to, [c.type]: n.type};
    if (c.task && n.taskId) f[c.task] = n.taskId;
    if (c.comment && n.commentId) f[c.comment] = n.commentId;
    if (c.text) f[c.text] = n.text||'';
    if (c.date) f[c.date] = now;
    return ['AddRecord', TABLES.notifs.table, null, f];
  });
  if (!acts.length) return;
  try { await grist.docApi.applyUserActions(acts); }
  catch(e){ flash("Votre modification est enregistrée, mais les notifications n'ont pas pu être créées : "+((e&&e.message)||e)); }
}
const typeKey = t => ({mention:'mention', assignation:'assignation', modification:'modification', reponse:'reponse', commentaire:'commentaire'}[norm(t)] || 'modification');
function dueItems(){
  const me = meObj(); if (!me || !map || !map.echeance) return [];
  const out = [], today = dayStart(new Date());
  records.forEach(r=>{
    if (isDel(r) || !(g(r,'statut') || isHP(r))) return;
    if (STATUT_TERMINE.includes(g(r,'statut')) || g(r,'statut')==='Abandonné') return;
    if (!refIds(r.responsables).includes(me.id) && !L(r,'personnes').includes(me.label)) return;
    const d = toDate(g(r,'echeance')); if (!d) return;
    const diff = Math.round((dayStart(d)-today)/86400000); if (diff>1) return;
    const key = `due:${r.id}:${dayStart(d).getTime()}:${diff<0?'late':'soon'}`;
    out.push({key, due:true, type: diff<0?'retard':'echeance', ids:[], taskId:r.id, author:'', texts:['Échéance : '+d.toLocaleDateString('fr-FR')], date:today, unread:!notifSeen.includes(key), diff});
  });
  return out;
}
function notifItems(){
  const me = meObj(); if (!me) return [];
  const rows = side.notifs.rows.filter(n=>n.recipient===me.id).sort((a,b)=>((b.date||0)-(a.date||0)) || (b.id-a.id));
  const items = [], open = {};
  rows.forEach(n=>{
    const type = typeKey(n.type), k = n.task+'|'+n.author;
    const g0 = type==='modification' && n.task ? open[k] : null;
    if (g0 && g0.oldest && n.date && (g0.oldest-n.date)<=GROUP_MS){   // regroupement sur 5 minutes
      g0.ids.push(n.id); g0.oldest = n.date; g0.unread = g0.unread || !n.read; if (n.text && !g0.texts.includes(n.text)) g0.texts.push(n.text); return;
    }
    const it = {key:'n'+n.id, type, ids:[n.id], taskId:n.task, commentId:n.comment, author:n.author, texts:n.text?[n.text]:[], date:n.date, oldest:n.date, unread:!n.read};
    items.push(it); if (type==='modification' && n.task) open[k] = it;
  });
  return [...dueItems(), ...items];
}
function relTime(d){
  if (!d) return '';
  const m = Math.round((Date.now()-d)/60000);
  if (m<1) return "à l'instant"; if (m<60) return `il y a ${m} min`;
  if (m<1440) return `il y a ${Math.round(m/60)} h`;
  return fmtDateTime(d);
}
function notifTitle(it){
  const c = it.taskId ? index.get(it.taskId) : null, t = c ? `« ${c.titre||'sans titre'} »` : 'une tâche', a = who(it.author) || "Quelqu'un";
  switch (it.type){
    case 'mention': return `${a} vous a mentionné(e) dans ${t}`;
    case 'assignation': return `${a} vous a ajouté(e) comme responsable de ${t}`;
    case 'reponse': return `${a} a répondu à votre commentaire dans ${t}`;
    case 'commentaire': return `${a} a commenté ${t}`;
    case 'echeance': return it.diff===0 ? `${t} arrive à échéance aujourd'hui` : `${t} arrive à échéance demain`;
    case 'retard': return `${t} a dépassé son échéance`;
    default: return it.taskId ? `${a} a modifié ${t}` : `${a} a modifié une tâche`;
  }
}
const icon = ty => `<span class="ic" style="background:${NOTIF_TYPES[ty].bg};color:${NOTIF_TYPES[ty].fg}" aria-hidden="true">${NOTIF_TYPES[ty].icon}</span>`;
function markRead(its){

function maybeToast(items){   // une nouvelle assignation est signalée sans attendre l'ouverture de la cloche

const isColDrag = e => e.dataTransfer && [...(e.dataTransfer.types||[])].includes('application/x-col');

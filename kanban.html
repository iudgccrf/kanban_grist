<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root { --bg:#f4f5f7; --col:#eeeef0; --card:#fff; --txt:#161616; --muted:#666; --accent:#3a55d8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Marianne","Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--txt); font-size:13px; }
  header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid #ddd; padding:8px 12px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  header select, header input { font:inherit; padding:4px 6px; border:1px solid #ccc; border-radius:4px; background:#fff; max-width:150px; }
  header input[type=search] { width:150px; }
  header label { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:3px; }
  header button { font:inherit; border:1px solid #ccc; background:#fff; border-radius:4px; padding:4px 8px; cursor:pointer; }
  header .spacer { flex:1; }
  #board { display:flex; gap:12px; padding:12px; align-items:flex-start; overflow-x:auto; min-height:calc(100vh - 60px); }
  .col { flex:0 0 280px; background:var(--col); border-radius:6px; padding:8px; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .col.over { outline:2px dashed var(--accent); }
  .col h2 { margin:2px 4px 8px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .dot { width:14px; height:14px; border-radius:50%; flex:none; }
  .count { margin-left:auto; background:#dde0e6; border-radius:10px; font-size:11px; padding:1px 7px; }
  .card { background:var(--card); border-radius:4px; padding:9px 10px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.18); cursor:pointer; }
  .card:hover { box-shadow:0 2px 6px rgba(0,0,0,.28); }
  .card.dragging { opacity:.4; }
  .card.open { outline:2px solid var(--accent); }
  .tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
  .tag { font-size:11px; font-weight:700; padding:2px 6px; border-radius:3px; white-space:nowrap; }
  .tag .x { margin-left:3px; opacity:.45; cursor:pointer; }
  .tag .x:hover { opacity:1; }
  .addtag { font-size:11px; padding:2px 7px; border:1px dashed #aab; border-radius:3px; color:#667; cursor:pointer; white-space:nowrap; }
  .addtag:hover { background:#eef1ff; color:var(--accent); border-color:var(--accent); }
  .title { font-size:14px; line-height:1.3; margin:2px 0 8px; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
  .date { font-weight:700; padding:1px 6px; border-radius:3px; }
  .d-ok { background:#c9f0d4; color:#1d6b35; }
  .d-orange { background:#ffe0b8; color:#9a4f00; }
  .d-red { background:#ffc9cc; color:#a3121d; }
  .d-grey { background:#e6e8ec; color:#555; }
  .avatars { margin-left:auto; display:flex; }
  .av { width:26px; height:26px; border-radius:50%; background:#c99a14; color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-left:-6px; border:2px solid #fff; }
  .add { color:var(--accent); font-weight:600; cursor:pointer; padding:6px 4px; background:none; border:0; font:inherit; font-weight:600; }
  .vote, .tosuivi, .tobacklog { border:1px solid #ccc; background:#fafafa; border-radius:12px; padding:1px 8px; cursor:pointer; font:inherit; font-size:12px; }
  .vote:hover { background:#eaf0ff; }
  .tosuivi, .tobacklog { margin-left:auto; }
  .msg { padding:30px; color:var(--muted); }
  .info { margin:8px 12px 0; padding:5px 10px; background:#eef2ff; border:1px solid #cdd6f7; border-radius:4px; font-size:12px; color:#2b3a7a; }
  #diag { margin:8px 12px 0; padding:8px 10px; background:#fff; border:1px solid #bbb; border-radius:4px; font:11px/1.4 Consolas,monospace; white-space:pre-wrap; word-break:break-all; user-select:all; max-height:260px; overflow:auto; }
  .err { margin:8px 12px 0; padding:6px 10px; background:#ffd9dc; border:1px solid #e59aa1; border-radius:4px; font-size:12px; }
  .warn { margin:8px 12px 0; padding:6px 10px; background:#fff4d6; border:1px solid #f0d58a; border-radius:4px; font-size:12px; }

  /* panneaux latéraux : couleurs et fiche de carte */
  #panel, #fiche { display:none; position:fixed; top:0; right:0; bottom:0; background:#fff; border-left:1px solid #ccc; box-shadow:-4px 0 12px rgba(0,0,0,.15); z-index:20; overflow-y:auto; padding:12px; }
  #panel { width:290px; }
  #fiche { width:350px; }
  #panel h3, #fiche h3 { margin:16px 0 6px; font-size:13px; }
  #panel .row, #fiche .row { display:flex; align-items:center; gap:8px; margin:4px 0; }
  #panel input[type=color] { width:34px; height:24px; padding:0; border:1px solid #ccc; border-radius:3px; background:none; cursor:pointer; }
  #panel input[type=number] { width:54px; }
  .close { float:right; border:0; background:none; font-size:20px; cursor:pointer; line-height:1; }
  #fiche input[type=text], #fiche select { font:inherit; padding:5px 7px; border:1px solid #ccc; border-radius:4px; background:#fff; min-width:0; }
  #fiche .ftitle { width:100%; font-size:16px; font-weight:700; padding:6px 8px; margin-top:4px; }
  #fiche .grow { flex:1; }
  #fiche .cat { margin:8px 0 12px; }
  #fiche .catl { font-size:12px; color:var(--muted); margin-bottom:4px; }
  #fiche .ftags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:5px; min-height:4px; }
  #fiche .btn { font:inherit; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:4px; padding:5px 11px; cursor:pointer; }
  #fiche .btn.light { background:#fff; color:var(--accent); }
  .bar { height:6px; background:#e3e6ee; border-radius:3px; overflow:hidden; margin:4px 0 8px; }
  .bar > i { display:block; height:100%; background:#17b3a3; }
  .ci { display:flex; align-items:center; gap:7px; margin:3px 0; }
  .ci input[type=checkbox] { width:16px; height:16px; flex:none; cursor:pointer; }
  .ci input[type=text] { flex:1; border-color:transparent !important; padding:3px 5px !important; }
  .ci input[type=text]:hover, .ci input[type=text]:focus { border-color:#ccc !important; }
  .ci.done input[type=text] { text-decoration:line-through; color:#888; }
  .ci .del { border:0; background:none; cursor:pointer; color:#999; font-size:16px; }
  .ci .del:hover { color:#c00; }

  #pop { display:none; position:fixed; top:80px; left:50%; transform:translateX(-50%); width:310px; background:#fff; border:1px solid #bbb; border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.3); z-index:30; padding:12px; }
  #pop .row { display:flex; gap:6px; margin:8px 0; }
  #pop select, #pop input { font:inherit; padding:5px 6px; border:1px solid #ccc; border-radius:4px; flex:1; min-width:0; }
  #pop button { font:inherit; padding:5px 10px; border:1px solid #ccc; border-radius:4px; background:#fff; cursor:pointer; }
  #pop button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #pop .hint { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<header id="hdr"></header>
<div id="warn"></div>
<div id="err"></div>
<div id="diag" style="display:none"></div>
<div id="board"><div class="msg">Chargement… Associez les colonnes dans le panneau de configuration du widget.</div></div>
<div id="panel"></div>
<div id="fiche"></div>
<div id="pop"></div>

<script>
/* ============ CONFIGURATION ============ */
const VERSION = '2026-10-30 c';   // affichée dans le bandeau bleu : permet de vérifier que le bon fichier est chargé
const STATUTS = ['A faire','En cours','Bloqué','A valider','Terminé','Abandonné','Archivé'];
const PRIOS   = ['P0 Critique','P1 Important','P2 Souhaitable','P3 Appréciable','Nouveau','Abandonné','Déjà prévu'];
const CHARGES = ['XS','S','M','L','XL'];
const STATUT_TERMINE = ['Terminé','Archivé'];   // dates affichées en vert
const STATUT_COLORS = ['#1e9ac8','#9bbf5a','#e5484d','#f5a623','#17b3a3','#8a8f98','#555b66'];
const PRIO_COLORS   = ['#e5484d','#f5a623','#1e9ac8','#6b8fb8','#9bbf5a','#8a8f98','#555b66'];
const PALETTE = [['#fdf1c4','#6b5a10'],['#fcd9d9','#8a2b2b'],['#d6eef7','#1f5f78'],['#dcebd9','#355a2f'],
                 ['#e8dcf5','#59397a'],['#ffe2c9','#8a4a12'],['#d9ecec','#245f5f'],['#ffd9e8','#8a2b55']];
const PRIO_TAG = [[/^P0/,['#fcd9d9','#b3202f']],[/^P1/,['#fff0c2','#8a5a00']],[/^P2/,['#d6eef7','#1f5f78']],[/^P3/,['#dde6f2','#3b5a80']]];
// Catégories d'étiquettes modifiables depuis la carte (clé du widget, libellé)
const TAG_CATS = [['etiquettes','Étiquettes'],['themes','Thèmes'],['produit','Produit'],['sources','Sources']];

const COLS = [
  {name:'titre',        title:'Titre de la tâche',                    type:'Text'},
  {name:'groupe',       title:'Colonne du Kanban (Statut ou Prio)',   type:'Choice'},
  {name:'statut',       title:'Statut (backlog/suivi et dates)',      type:'Choice', optional:true},
  {name:'prio',         title:'Priorité',                             type:'Choice', optional:true},
  {name:'charge',       title:'Charge (XS…XL)',                       type:'Choice', optional:true},
  {name:'produit',      title:'Produit',                              type:'Choice,ChoiceList', optional:true},
  {name:'themes',       title:'Thèmes',                               type:'Choice,ChoiceList', optional:true},
  {name:'sources',      title:'Sources',                              type:'Choice,ChoiceList', optional:true},
  {name:'etiquettes',   title:'Étiquettes libres (Liste de choix)',   type:'ChoiceList', optional:true},
  {name:'personnes',    title:'Responsables (colonne texte/formule)', type:'Text,ChoiceList', optional:true},
  {name:'echeance',     title:"Date d'échéance",                      type:'Date,DateTime', optional:true},
  {name:'checklist',    title:'Checklist (colonne Texte)',            type:'Text', optional:true},
  {name:'pj',           title:'Pièces jointes',                       type:'Attachments', optional:true},
  {name:'commentaires', title:'Nb de commentaires',                   type:'Int,Numeric', optional:true},
  {name:'votes',        title:'Votes',                                type:'Int,Numeric', optional:true},
];

/* ============ ÉTAT ============ */
let mode = 'suivi';            // suivi | backlog | perso
let moi = '';                  // nom de la personne pour le mode "perso"
let map = null;                // association des colonnes
let host = null;               // identifiant de la table où le widget est installé
let records = [];              // enregistrements de la table
let index = new Map();         // id -> enregistrement
let colors = {groups:{}, tags:{}};
let thr = {orange:3, red:1};
let panelOpen = false;
let openId = null;             // carte ouverte dans la fiche
let ficheSig = '';             // signature de la carte affichée (évite de reconstruire la fiche inutilement)
let nCalls = 0, lastCall = '';   // diagnostic : nombre d'appels onRecords
let diagOpen = false, tableCount = null;
let focusAfter = null;         // champ à refocaliser après reconstruction de la fiche
const F = {prio:'',charge:'',theme:'',personne:'',produit:'',source:'',etiquette:'',from:'',to:'',q:''};

/* ============ OUTILS ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toList(v){
  if (v == null || v === '') return [];
  if (Array.isArray(v)) return (v[0]==='L' ? v.slice(1) : v).map(String).filter(Boolean);
  return String(v).split(',').map(s=>s.trim()).filter(Boolean);
}
function hash(s){ let h=0; for (const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function rgb(hex){ const n=parseInt(hex.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function toHex(a){ return '#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''); }
function lighten(hex,p){ return toHex(rgb(hex).map(v=>v*(1-p)+255*p)); }
function darken(hex,p){ return toHex(rgb(hex).map(v=>v*(1-p))); }
function defaultTagColors(label,kind){
  if (kind==='prio') for (const [re,col] of PRIO_TAG) if (re.test(label)) return col;
  return PALETTE[hash(label)%PALETTE.length];
}
function tag(label, kind){
  let c = null;
  if (colors.tags[label]) c = [lighten(colors.tags[label],.8), darken(colors.tags[label],.45)];
  if (!c) c = defaultTagColors(label,kind);
  return `<span class="tag" style="background:${c[0]};color:${c[1]}">${esc(label)}</span>`;
}
function tagX(label, key){
  return tag(label).replace(/<\/span>$/, `<span class="x" data-rm="${key}" data-val="${esc(label)}" title="Retirer cette étiquette">×</span></span>`);
}
function toDate(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return new Date(v*1000);
  const d = new Date(v); return isNaN(d) ? null : d;
}
function dayStart(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function fmtDate(d){ return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
function initials(n){ return n.split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function g(r,k){ return map && map[k] ? r[k] : undefined; }

/* ---- Checklist : texte, une ligne par point "- [ ] à faire" / "- [x] fait" ---- */
const CL_RE = /^(\s*[-*]\s*)\[( |x|X)\]\s?(.*)$/;
function parseChecklist(text){
  const lines = String(text||'').split('\n');
  const items = [];
  lines.forEach((l,i)=>{ const m = l.match(CL_RE); if (m) items.push({i, done:m[2].toLowerCase()==='x', text:m[3]}); });
  return {lines, items};
}
function checklistCount(t){
  const {items} = parseChecklist(t);
  return {done: items.filter(x=>x.done).length, total: items.length};
}

/* ============ ÉCRITURE DANS GRIST ============ */
// Met à jour la carte tout de suite à l'écran (optimiste), puis écrit dans Grist.
// changes : {cléWidget: valeur affichée} ; encoded : {cléWidget: valeur envoyée à Grist} (listes : ['L', ...])
async function update(card, changes, encoded){
  const cols = {};
  for (const k in changes){
    if (!map[k]) continue;
    card[k] = changes[k];
    cols[map[k]] = (encoded && k in encoded) ? encoded[k] : changes[k];
  }
  if (!Object.keys(cols).length) return;
  render();
  await act([['UpdateRecord', host, card.id, cols]]);
}
async function act(actions){
  if (!host){ alert("Table du widget introuvable : rechargez la page."); return; }
  try { await grist.docApi.applyUserActions(actions); }
  catch(e){ alert('Action refusée ou impossible : ' + ((e && e.message) || e)); }
}

/* ============ FILTRAGE ============ */
function groupList(){
  const base = mode==='backlog' ? PRIOS : STATUTS;
  const defaults = mode==='backlog' ? PRIO_COLORS : STATUT_COLORS;
  const seen = new Set(base);
  const extra = [...new Set(records.map(r=>r.groupe).filter(v=>v && !seen.has(v)))];
  return [...base,...extra].map((n,i)=>({name:n,color:colors.groups[n]||defaults[i]||'#999'}));
}
// Règle Backlog / Suivi : un Statut renseigné = Suivi ; pas de Statut = Backlog
function inView(r){
  if (!map.statut) return true;
  const hasStatut = !!g(r,'statut');
  return mode==='backlog' ? !hasStatut : hasStatut;
}
function passes(r){
  const l = k => toList(g(r,k));
  if (!inView(r)) return false;
  const who = mode==='perso' ? moi : F.personne;       // "Mes tâches" : mes tâches uniquement
  if (who && !l('personnes').includes(who)) return false;
  if (F.prio && g(r,'prio') !== F.prio) return false;
  if (F.charge && g(r,'charge') !== F.charge) return false;
  if (F.theme && !l('themes').includes(F.theme)) return false;
  if (F.produit && !l('produit').includes(F.produit)) return false;
  if (F.source && !l('sources').includes(F.source)) return false;
  if (F.etiquette && !l('etiquettes').includes(F.etiquette)) return false;
  if (mode!=='backlog' && (F.from||F.to)){
    const d = toDate(g(r,'echeance')); if (!d) return false;
    if (F.from && dayStart(d) < dayStart(F.from)) return false;
    if (F.to && dayStart(d) > dayStart(F.to)) return false;
  }
  if (F.q){
    const hay = [r.titre,...l('themes'),...l('sources'),...l('produit'),...l('etiquettes'),...l('personnes'),g(r,'checklist')].join(' ').toLowerCase();
    if (!hay.includes(F.q.toLowerCase())) return false;
  }
  return true;
}
function uniq(key){ return [...new Set(records.flatMap(r=>toList(g(r,key))))].sort((a,b)=>a.localeCompare(b,'fr')); }
function uniqSingle(key, base=[]){ return [...new Set([...base, ...records.map(r=>g(r,key)).filter(Boolean)])]; }

/* ============ RENDU ============ */
function renderHeader(){
  const opt = (arr,val) => `<option value="">— tous —</option>` + arr.map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('');
  const sel = (id,label,arr,val) => map ? `<label>${label}<select id="${id}">${opt(arr,val)}</select></label>` : '';
  const has = k => map && map[k];
  let h = `<label>Mode <select id="mode">
      <option value="suivi" ${mode==='suivi'?'selected':''}>Suivi de projet</option>
      <option value="backlog" ${mode==='backlog'?'selected':''}>Backlog</option>
      <option value="perso" ${mode==='perso'?'selected':''}>Mes tâches</option></select></label>`;
  if (mode!=='backlog' && has('prio')) h += sel('f-prio','Prio',uniqSingle('prio'),F.prio);
  if (has('charge')) h += sel('f-charge','Charge',uniqSingle('charge'),F.charge);
  if (has('themes')) h += sel('f-theme','Thème',uniq('themes'),F.theme);
  if (has('personnes')) h += sel('f-personne', mode==='perso'?'Moi':'Personne', uniq('personnes'), mode==='perso'?moi:F.personne);
  if (has('produit')) h += sel('f-produit','Produit',uniq('produit'),F.produit);
  if (has('sources')) h += sel('f-source','Source',uniq('sources'),F.source);
  if (has('etiquettes')) h += sel('f-etiquette','Étiquette',uniq('etiquettes'),F.etiquette);
  if (mode!=='backlog' && has('echeance')) h += `<label>Du <input type="date" id="f-from" value="${F.from}"></label><label>au <input type="date" id="f-to" value="${F.to}"></label>`;
  h += `<input type="search" id="f-q" placeholder="Mot clé…" value="${esc(F.q)}">`;
  h += `<button id="reset">Réinitialiser</button><span class="spacer"></span><button id="diagBtn">🔧 Diagnostic</button><button id="colorsBtn">🎨 Couleurs</button>`;
  document.getElementById('hdr').innerHTML = h;

  const bind = (id,key) => { const e=document.getElementById(id); if(e) e.onchange = ()=>{F[key]=e.value; render();}; };
  bind('f-prio','prio'); bind('f-charge','charge'); bind('f-theme','theme');
  bind('f-produit','produit'); bind('f-source','source'); bind('f-etiquette','etiquette'); bind('f-from','from'); bind('f-to','to');
  const fp = document.getElementById('f-personne');
  if (fp) fp.onchange = ()=>{ if(mode==='perso'){ moi=fp.value; grist.setOption('moi',moi); } else F.personne=fp.value; render(); };
  const q=document.getElementById('f-q'); if(q) q.oninput = ()=>{F.q=q.value; renderBoard();};
  document.getElementById('mode').onchange = e=>{ mode=e.target.value; grist.setOption('mode',mode); render(); };
  document.getElementById('diagBtn').onclick = ()=>{ diagOpen=!diagOpen; if(diagOpen) loadTableCount(); renderDiag(); };
  document.getElementById('colorsBtn').onclick = ()=>{ panelOpen=!panelOpen; if(panelOpen) closeFiche(); renderPanel(); };
  document.getElementById('reset').onclick = ()=>{ Object.keys(F).forEach(k=>F[k]=''); render(); };
}
function renderWarn(){
  const w = document.getElementById('warn');
  const parts = [];
  if (map && mode!=='backlog' && map.statut && map.groupe && map.statut!==map.groupe)
    parts.push(`<div class="warn"><b>Association à corriger</b> : en mode Suivi / Mes tâches, « Colonne du Kanban » (${esc(map.groupe)}) et « Statut » (${esc(map.statut)}) doivent être la <b>même colonne</b> (Statut). Sinon les cartes créées ou déplacées n'ont pas de Statut et sont rangées dans le Backlog.</div>`);
  if (map){
    const total = records.length, inv = records.filter(inView).length, shown = records.filter(passes).length;
    let t = `${total} ligne(s) reçue(s) de « ${esc(host||'?')} » · ${shown} affichée(s) dans cette vue`;
    if (inv<total) t += ` · ${total-inv} dans l'autre vue (${mode==='backlog'?'Suivi':'Backlog'}) à cause du Statut`;
    if (inv>shown) t += ` · ${inv-shown} masquée(s) par les filtres`;
    t += `. Colonne du Kanban → <b>${esc(map.groupe||'?')}</b> · Statut → <b>${esc(map.statut||'non associé')}</b>.`;
    if (!total) t += ` <b>Grist n'envoie aucune ligne</b> : vérifiez qu'aucun filtre n'est actif sur le widget (bouton « Enregistrer » / ↺ en haut à droite de la section).`;
    parts.push(`<div class="info">${t} <span style="opacity:.6">(widget v${VERSION})</span></div>`);
  }
  w.innerHTML = parts.join('');
}

function dateBadge(r){
  const d = toDate(g(r,'echeance')); if(!d) return '';
  const statut = g(r,'statut') || (mode!=='backlog' ? r.groupe : '');
  let cls = 'd-grey';
  if (STATUT_TERMINE.includes(statut)) cls = 'd-ok';
  else {
    const diff = Math.round((dayStart(d)-dayStart(new Date()))/86400000);
    if (diff <= thr.red) cls = 'd-red'; else if (diff <= thr.orange) cls = 'd-orange';
  }
  return `<span class="date ${cls}">${fmtDate(d)}${cls==='d-ok'?' ✔':''}</span>`;
}
function cardHtml(r){
  const l = k => toList(g(r,k));
  let tags = '';
  if (mode!=='backlog' && g(r,'prio')) tags += tag(g(r,'prio'),'prio');
  if (g(r,'charge')) tags += tag(g(r,'charge'));
  l('etiquettes').forEach(t=>tags+=tagX(t,'etiquettes'));
  l('produit').forEach(t=>tags+=tagX(t,'produit'));
  l('themes').forEach(t=>tags+=tagX(t,'themes'));
  l('sources').forEach(t=>tags+=tagX(t,'sources'));
  tags += `<span class="addtag" data-addtag="1" title="Ajouter une étiquette">+ étiquette</span>`;
  let meta = dateBadge(r);
  const cl = checklistCount(g(r,'checklist'));
  if (cl.total) meta += `<span>☑ ${cl.done}/${cl.total}</span>`;
  const pj = toList(g(r,'pj')).length; if (pj) meta += `<span>📎${pj}</span>`;
  if (mode!=='backlog' && map.commentaires && g(r,'commentaires')) meta += `<span>🗨️${g(r,'commentaires')}</span>`;
  if (mode==='backlog' && map.votes) meta += `<button class="vote" data-vote="1">👍 ${g(r,'votes')||0}</button>`;
  if (mode==='backlog' && map.statut) meta += `<button class="tosuivi" data-tosuivi="1" title="Passer dans le suivi (statut A faire)">➜ Suivi</button>`;
  if (mode!=='backlog' && map.statut && g(r,'statut')==='A faire') meta += `<button class="tobacklog" data-tobacklog="1" title="Remettre dans le backlog (statut vidé)">⬅ Backlog</button>`;
  const av = l('personnes').map(n=>`<div class="av" title="${esc(n)}">${esc(initials(n))}</div>`).join('');
  return `<div class="card${r.id===openId?' open':''}" draggable="true" data-id="${r.id}">
    <div class="tags">${tags}</div>
    <div class="title">${esc(r.titre)||'<i>(sans titre)</i>'}</div>
    <div class="meta">${meta}<div class="avatars">${av}</div></div></div>`;
}
function renderBoard(){
  const board = document.getElementById('board');
  if (!map){ board.innerHTML = '<div class="msg">Associez au minimum les colonnes <b>Titre</b> et <b>Colonne du Kanban</b> dans la configuration du widget.</div>'; return; }
  const shown = records.filter(passes);
  board.innerHTML = groupList().map(gr=>{
    const cards = shown.filter(r=>(r.groupe||'')===gr.name).sort((a,b)=>{
      const da=toDate(g(a,'echeance')), db=toDate(g(b,'echeance'));
      return (da?+da:9e15)-(db?+db:9e15);
    });
    return `<div class="col" data-group="${esc(gr.name)}">
      <h2><span class="dot" style="background:${gr.color}"></span>${esc(gr.name)}<span class="count">${cards.length}</span></h2>
      ${cards.map(cardHtml).join('')}
      <button class="add" data-add="${esc(gr.name)}">+ Nouvelle carte</button></div>`;
  }).join('');
  wire();
}
function showError(e){
  const el = document.getElementById('err'); if (!el) return;
  const msg = (e && (e.stack || e.message)) || String(e);
  el.innerHTML = `<div class="err"><b>Erreur dans le widget</b> (copiez ce texte et envoyez-le) :<br><code>${esc(msg).slice(0,700)}</code></div>`;
}
function render(){
  try { rebuild(); renderHeader(); renderWarn(); renderBoard(); renderPanel(); renderFiche(); renderDiag(); document.getElementById('err').innerHTML=''; }
  catch(e){ showError(e); }
}
window.addEventListener('error', e=>showError(e.error||e.message));
window.addEventListener('unhandledrejection', e=>showError(e.reason));

/* ---- Diagnostic ---- */
async function loadTableCount(){
  try { const t = await grist.docApi.fetchTable(host); tableCount = (t.id||[]).length; } catch(e){ tableCount = 'erreur : '+((e&&e.message)||e); }
  renderDiag();
}
function renderDiag(){
  const d = document.getElementById('diag');
  if (!diagOpen){ d.style.display='none'; return; }
  d.style.display='block';
  const first = records[0] ? JSON.stringify(records[0]) : '(aucune)';
  const active = Object.entries(F).filter(([k,v])=>v).map(([k,v])=>k+'='+v).join(', ') || 'aucun';
  d.textContent = [
    'Version du widget : '+VERSION,
    'Table du widget : '+host,
    'Mode : '+mode+' | filtres du widget : '+active,
    'onRecords appelé '+nCalls+' fois (dernier : '+(lastCall||'jamais')+')',
    'Lignes reçues de Grist : '+records.length,
    'Lignes dans la table (tous filtres ignorés) : '+tableCount,
    'Association des colonnes : '+JSON.stringify(map),
    'Cartes affichables dans cette vue : '+(map?records.filter(passes).length:'?'),
    'Première ligne reçue : '+first.slice(0,700),
  ].join('\n');
}
function rebuild(){ index = new Map(records.map(r=>[r.id,r])); }

/* ---- Panneau de personnalisation des couleurs ---- */
function saveColors(){ grist.setOption('colors', colors); }
function renderPanel(){
  const p = document.getElementById('panel');
  if (!panelOpen || !map){ p.style.display='none'; return; }
  p.style.display = 'block';
  const groups = groupList();
  const tagVals = [...new Set([
    ...records.map(r=>g(r,'prio')), ...records.map(r=>g(r,'charge')),
    ...TAG_CATS.map(([k])=>k).flatMap(k=>records.flatMap(r=>toList(g(r,k))))
  ].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
  p.innerHTML = `<button class="close" id="pclose">×</button><b>Personnalisation</b>
    <h3>Colonnes du Kanban</h3>
    ${groups.map(gr=>`<div class="row"><input type="color" data-grp="${esc(gr.name)}" value="${gr.color.length===7?gr.color:'#999999'}"> ${esc(gr.name)}</div>`).join('')}
    <h3>Étiquettes (couleur de base : le fond est éclairci automatiquement)</h3>
    ${tagVals.map(v=>`<div class="row"><input type="color" data-tag="${esc(v)}" value="${colors.tags[v]||defaultTagColors(v,'')[1]}"> ${tag(v)}</div>`).join('')}
    <h3>Alertes d'échéance</h3>
    <div class="row">Orange à <input type="number" id="t-orange" min="0" value="${thr.orange}"> jour(s) ou moins</div>
    <div class="row">Rouge à <input type="number" id="t-red" min="0" value="${thr.red}"> jour(s) ou moins</div>
    <div class="row"><button id="creset">Rétablir les couleurs par défaut</button></div>`;
  document.getElementById('pclose').onclick = ()=>{ panelOpen=false; renderPanel(); };
  p.querySelectorAll('[data-grp]').forEach(i=>{
    i.oninput = ()=>{ colors.groups[i.dataset.grp]=i.value; renderBoard(); };
    i.onchange = ()=>{ saveColors(); };
  });
  p.querySelectorAll('[data-tag]').forEach(i=>{
    i.oninput = ()=>{ colors.tags[i.dataset.tag]=i.value; renderBoard(); };
    i.onchange = ()=>{ saveColors(); renderPanel(); };
  });
  document.getElementById('t-orange').onchange = e=>{ thr.orange=+e.target.value; grist.setOption('orange',thr.orange); renderBoard(); };
  document.getElementById('t-red').onchange = e=>{ thr.red=+e.target.value; grist.setOption('red',thr.red); renderBoard(); };
  document.getElementById('creset').onclick = ()=>{ colors={groups:{},tags:{}}; saveColors(); render(); };
}

/* ============ ÉTIQUETTES ============ */
function isListCol(key){
  const vals = records.map(r=>g(r,key)).filter(v=>v!=null && v!=='');
  return vals.length===0 || vals.some(v=>Array.isArray(v));
}
function writeTags(card, key, list){
  if (isListCol(key)) return update(card, {[key]: list}, {[key]: ['L',...list]});
  return update(card, {[key]: list[0] ?? null});      // colonne "Choix" simple : une seule valeur
}
function addTag(card, key, value){
  value = String(value||'').trim(); if (!value) return;
  const cur = toList(g(card,key));
  if (cur.includes(value)) return;
  return writeTags(card, key, isListCol(key) ? [...cur,value] : [value]);
}
function removeTag(card, key, value){
  return writeTags(card, key, toList(g(card,key)).filter(v=>v!==value));
}

/* ============ POPUPS (+ étiquette sur la carte, nouvelle carte) ============ */
function closePop(){ document.getElementById('pop').style.display='none'; }
function openPop(html){ const p=document.getElementById('pop'); p.innerHTML=html; p.style.display='block'; return p; }
function openTagPop(card){
  const cats = TAG_CATS.filter(([k])=>map[k]);
  openPop(`<b>Ajouter une étiquette</b>
    <div class="row"><select id="pc">${cats.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div>
    <div class="row"><input id="pv" list="pl" placeholder="Choisir ou taper un nouveau nom…" autocomplete="off"><datalist id="pl"></datalist></div>
    <div class="hint">Un nom qui n'existe pas encore est créé automatiquement.</div>
    <div class="row" style="justify-content:flex-end"><button id="pcancel">Annuler</button><button class="primary" id="pok">Ajouter</button></div>`);
  const fill = ()=>{ document.getElementById('pl').innerHTML = uniq(document.getElementById('pc').value).map(v=>`<option value="${esc(v)}">`).join(''); };
  document.getElementById('pc').onchange = fill; fill();
  const ok = ()=>{ const v=document.getElementById('pv').value; const k=document.getElementById('pc').value; closePop(); addTag(card,k,v); };
  document.getElementById('pok').onclick = ok;
  document.getElementById('pcancel').onclick = closePop;
  document.getElementById('pv').onkeydown = e=>{ if(e.key==='Enter') ok(); if(e.key==='Escape') closePop(); };
  document.getElementById('pv').focus();
}
function openNewPop(group){
  openPop(`<b>Nouvelle carte</b> <span class="hint">(${esc(group)})</span>
    <div class="row"><input id="nt" placeholder="Titre de la tâche…" autocomplete="off"></div>
    <div class="row" style="justify-content:flex-end"><button id="ncancel">Annuler</button><button class="primary" id="nok">Créer</button></div>`);
  const ok = ()=>{
    const t = document.getElementById('nt').value.trim();
    if (!t) return; closePop();
    act([['AddRecord', host, null, {[map.titre]: t, [map.groupe]: group}]]);
  };
  document.getElementById('nok').onclick = ok;
  document.getElementById('ncancel').onclick = closePop;
  document.getElementById('nt').onkeydown = e=>{ if(e.key==='Enter') ok(); if(e.key==='Escape') closePop(); };
  document.getElementById('nt').focus();
}

/* ============ FICHE DE LA CARTE (titre, étiquettes, checklist) ============ */
function openFiche(id){ openId = id; panelOpen = false; ficheSig = ''; render(); }
function closeFiche(){ if (openId===null) return; openId = null; ficheSig = ''; document.getElementById('fiche').style.display='none'; renderBoard(); }
function sigOf(r){
  return JSON.stringify([r.titre, r.groupe, g(r,'prio'), g(r,'charge'), g(r,'checklist'), ...TAG_CATS.map(([k])=>toList(g(r,k)))]);
}
function renderFiche(){
  const f = document.getElementById('fiche');
  const r = openId!==null ? index.get(openId) : null;
  if (!r || !map){ f.style.display='none'; if (openId!==null && !r) openId=null; return; }
  f.style.display = 'block';
  const sig = sigOf(r);
  if (sig===ficheSig && f.innerHTML) return;            // rien n'a changé : on ne touche pas à la saisie en cours
  ficheSig = sig;

  const cats = TAG_CATS.filter(([k])=>map[k]).map(([k,n])=>`
    <div class="cat">
      <div class="catl">${n}</div>
      <div class="ftags">${toList(g(r,k)).map(t=>tagX(t,k)).join('') || '<span class="catl">aucune</span>'}</div>
      <div class="row"><input type="text" class="grow" id="ta-${k}" list="dl-${k}" placeholder="Ajouter ou créer…" autocomplete="off">
        <datalist id="dl-${k}">${uniq(k).filter(v=>!toList(g(r,k)).includes(v)).map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
        <button class="btn" data-fadd="${k}" title="Ajouter">+</button></div>
    </div>`).join('');

  let checklist;
  if (!map.checklist) checklist = `<div class="catl">Associez une colonne <b>Texte</b> au champ « Checklist » dans la configuration du widget pour activer la checklist.</div>`;
  else {
    const {items} = parseChecklist(g(r,'checklist'));
    const done = items.filter(x=>x.done).length;
    checklist = `${items.length?`<div class="catl">${done}/${items.length} fait(s)</div><div class="bar"><i style="width:${Math.round(100*done/items.length)}%"></i></div>`:''}
      ${items.map(x=>`<div class="ci${x.done?' done':''}"><input type="checkbox" data-cl-toggle="${x.i}" ${x.done?'checked':''}>
        <input type="text" data-cl-text="${x.i}" value="${esc(x.text)}"><button class="del" data-cl-del="${x.i}" title="Supprimer ce point">×</button></div>`).join('')}
      <div class="row"><input type="text" class="grow" id="cl-add" placeholder="Ajouter un point…" autocomplete="off"><button class="btn" id="cl-addbtn" title="Ajouter">+</button></div>`;
  }

  const sel = (id, label, arr, val) => `<div class="grow"><div class="catl">${label}</div><select id="${id}" style="width:100%"><option value="">—</option>${arr.map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;
  f.innerHTML = `<button class="close" id="fclose" title="Fermer">×</button>
    <div class="catl">Fiche de la carte</div>
    <input type="text" class="ftitle" id="f-title" value="${esc(r.titre)}" placeholder="Titre de la tâche">
    ${(map.prio||map.charge)?`<div class="row" style="margin-top:12px">${map.prio?sel('fp-prio','Priorité',uniqSingle('prio',PRIOS),g(r,'prio')):''}${map.charge?sel('fp-charge','Charge',uniqSingle('charge',CHARGES),g(r,'charge')):''}</div>`:''}
    <h3>Étiquettes</h3>${cats || '<div class="catl">Associez au moins une colonne Étiquettes, Thèmes, Produit ou Sources.</div>'}
    <h3>Checklist</h3>${checklist}`;

  // --- branchements ---
  document.getElementById('fclose').onclick = closeFiche;
  document.getElementById('f-title').onchange = e=>{ const v=e.target.value.trim(); if (v!==r.titre) update(r,{titre:v}); };
  const fp = document.getElementById('fp-prio'); if (fp) fp.onchange = ()=>update(r,{prio:fp.value||null});
  const fc = document.getElementById('fp-charge'); if (fc) fc.onchange = ()=>update(r,{charge:fc.value||null});
  f.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>removeTag(r, x.dataset.rm, x.dataset.val));
  const commitTag = k=>{ const inp=document.getElementById('ta-'+k); const v=inp.value; if(!v.trim()) return; focusAfter='ta-'+k; addTag(r,k,v); };
  f.querySelectorAll('[data-fadd]').forEach(b=>b.onclick=()=>commitTag(b.dataset.fadd));
  TAG_CATS.forEach(([k])=>{ const inp=document.getElementById('ta-'+k); if(inp) inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); commitTag(k); } }; });

  if (map.checklist){
    const edit = fn => { const {lines} = parseChecklist(g(r,'checklist')); fn(lines); update(r,{checklist: lines.join('\n')}); };
    f.querySelectorAll('[data-cl-toggle]').forEach(c=>c.onchange=()=>edit(lines=>{
      const i=+c.dataset.clToggle; lines[i] = lines[i].replace(/\[( |x|X)\]/, c.checked?'[x]':'[ ]');
    }));
    f.querySelectorAll('[data-cl-text]').forEach(t=>t.onchange=()=>edit(lines=>{
      const i=+t.dataset.clText, v=t.value.trim();
      if (!v) lines.splice(i,1); else lines[i] = lines[i].replace(CL_RE, (m,pre,x)=>`${pre}[${x}] ${v}`);
    }));
    f.querySelectorAll('[data-cl-del]').forEach(b=>b.onclick=()=>edit(lines=>lines.splice(+b.dataset.clDel,1)));
    const addItem = ()=>{
      const inp=document.getElementById('cl-add'); const v=inp.value.trim(); if(!v) return;
      focusAfter='cl-add';
      edit(lines=>{ while(lines.length && lines[lines.length-1].trim()==='') lines.pop(); lines.push('- [ ] '+v); });
    };
    document.getElementById('cl-addbtn').onclick = addItem;
    document.getElementById('cl-add').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); addItem(); } };
  }
  if (focusAfter){ const e=document.getElementById(focusAfter); if(e) e.focus(); focusAfter=null; }
}

/* ============ INTERACTIONS ============ */
function cardOf(el){ const c = el.closest('.card'); return c ? index.get(+c.dataset.id) : null; }
function wire(){
  let dragId = null;
  document.querySelectorAll('.card').forEach(c=>{
    c.ondragstart = e=>{ dragId=+c.dataset.id; c.classList.add('dragging'); e.dataTransfer.setData('text/plain',String(dragId)); };
    c.ondragend = ()=>c.classList.remove('dragging');
    c.onclick = e=>{
      if (e.target.closest('button,.addtag,.x')) return;
      const id = +c.dataset.id;
      grist.setCursorPos({rowId:id}).catch(()=>{});
      openFiche(id);
    };
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.ondragover = e=>{ e.preventDefault(); col.classList.add('over'); };
    col.ondragleave = ()=>col.classList.remove('over');
    col.ondrop = e=>{
      e.preventDefault(); col.classList.remove('over');
      const r = index.get(+(e.dataTransfer.getData('text/plain') || dragId)); if(!r) return;
      update(r, {groupe: col.dataset.group});
    };
  });
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openNewPop(b.dataset.add));
  document.querySelectorAll('[data-addtag]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(!TAG_CATS.some(([k])=>map[k])){ alert("Associez au moins une colonne Étiquettes, Thèmes, Produit ou Sources dans la configuration du widget."); return; }
    openTagPop(cardOf(b));
  });
  document.querySelectorAll('.card [data-rm]').forEach(x=>x.onclick=e=>{ e.stopPropagation(); removeTag(cardOf(x), x.dataset.rm, x.dataset.val); });
  document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{
    const r = cardOf(b); update(r, {votes:(Number(g(r,'votes'))||0)+1});
  });
  document.querySelectorAll('[data-tosuivi]').forEach(b=>b.onclick=()=>update(cardOf(b), {statut:'A faire'}));
  document.querySelectorAll('[data-tobacklog]').forEach(b=>b.onclick=()=>update(cardOf(b), {statut:null}));
}
document.addEventListener('keydown', e=>{
  if (e.key!=='Escape') return;
  if (document.getElementById('pop').style.display==='block') closePop(); else closeFiche();
});

/* ============ GRIST ============ */
grist.ready({ columns: COLS, requiredAccess: 'full', allowSelectBy: true });
grist.onOptions(o=>{
  if (o && o.mode) mode = o.mode;
  if (o && o.moi !== undefined) moi = o.moi;
  if (o && o.colors) colors = {groups:o.colors.groups||{}, tags:o.colors.tags||{}};
  if (o && o.orange != null) thr.orange = Number(o.orange);
  if (o && o.red != null) thr.red = Number(o.red);
  render();
});
grist.onRecords(async (recs, mappings)=>{
  nCalls++; lastCall = new Date().toLocaleTimeString('fr-FR')+' – '+((recs||[]).length)+' ligne(s)';
  map = mappings;
  if (!host){ try { host = await grist.selectedTable.getTableId(); } catch(e){ host = null; } }
  records = recs || [];
  render();
});
</script>
